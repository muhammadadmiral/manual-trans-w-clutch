<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT HUD — Global Analog Lumen</title><style>
:root{--scale:1;--fg:#f2f8fb;--muted:#8b9aa3;--cyan:#63f2ff;--amber:#ffc46d;--red:#ff6373;--green:#8ef7ab;--beige:#ffefca}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--fg)} body{display:grid;place-items:end center;padding-bottom:18px}
#hud{position:relative;width:1000px;height:290px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 12px 28px rgba(0,0,0,.38))} #hud.hidden{opacity:0;transform:translateY(16px) scale(.96)}
.base{position:absolute;left:70px;right:70px;top:20px;height:236px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(13,19,24,.72),rgba(7,11,15,.6));backdrop-filter:blur(12px);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.dialL,.dialR{position:absolute;top:0;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 50% 46%,rgba(245,239,219,.08) 0 49%, rgba(10,15,18,.92) 50% 62%, rgba(255,255,255,.06) 63%, rgba(10,15,18,.9) 64% 69%, transparent 70%)} .dialL{left:0}.dialR{right:0}
.dialL svg,.dialR svg{position:absolute;inset:0;width:100%;height:100%}.tickA{stroke:#efe8d4;stroke-width:2.4;stroke-linecap:round}.tickB{stroke:#706d62;stroke-width:1.1;stroke-linecap:round}.dialNum{fill:#efe8d4;font-size:13px;font-weight:800;text-anchor:middle} .dialMeta{position:absolute;left:0;right:0;top:176px;text-align:center}.dialMeta b{display:block;font:900 32px/.9 "Arial Narrow",Inter,sans-serif}.dialMeta span{font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:800}.ndA{stroke:var(--beige);stroke-width:4;stroke-linecap:round}.ndB{stroke:var(--cyan);stroke-width:4;stroke-linecap:round}.hub{fill:#f8eed6;stroke:#10181c;stroke-width:5}
.center{position:absolute;left:260px;right:260px;top:14px;bottom:14px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.modeRow{display:flex;justify-content:space-between;align-items:center}.modeRow .m{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:800}.modeRow .g{font:900 74px/.82 "Arial Narrow",Inter,sans-serif}.sel{font-size:10px;letter-spacing:2px;color:var(--amber);font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03)} .box .k{font-size:9px;letter-spacing:1.8px;color:var(--muted);font-weight:800}.box .v{margin-top:5px;font:800 20px/1 "Roboto Mono",Consolas,monospace}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.barBox{padding:10px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03)} .barHead{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.bb{height:7px;background:rgba(255,255,255,.07);border-radius:8px;margin-top:8px;overflow:hidden}.bb i{display:block;height:100%;width:0;border-radius:inherit}
.lamps{display:flex;justify-content:center;gap:8px}.lamp{min-width:56px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(8,13,16,.45);font-size:10px;letter-spacing:1px;color:#62747d;font-weight:900;text-align:center} .lamp.enabled{color:#92a5ad}.lamp.active{color:#041015;background:rgba(99,242,255,.95);border-color:transparent;box-shadow:0 0 14px rgba(99,242,255,.32)} .lamp.warn.active{background:rgba(255,196,109,.95)} .lamp.danger.active{background:rgba(255,99,115,.95);color:#fff}
.overlay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:999px}.overlay.on{opacity:1}.overlay b{font-size:15px;letter-spacing:5px}.overlay b.starting{color:var(--amber);animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.35}}
.demo-panel{position:fixed;top:10px;right:10px;width:275px;max-height:calc(100vh - 20px);overflow:auto;padding:10px;border-radius:12px;background:rgba(5,8,10,.94);color:#d7e7ee;border:1px solid #2a4048;font:11px Consolas,monospace;z-index:10}.demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px}.demo-panel label{display:grid;grid-template-columns:86px 1fr 42px;gap:6px;align-items:center;margin:4px 0}.demo-panel button{margin:2px;border:1px solid #34505b;background:#0d161b;color:#99b8c4;border-radius:6px;padding:4px 6px;font:10px Consolas;cursor:pointer}.demo-panel button.on{background:var(--cyan);color:#051015;border-color:transparent} body.game .demo-panel{display:none}
@media (max-width:1040px){:root{--scale:.82}} @media (max-width:860px){:root{--scale:.66}}
</style></head><body>
<div id="hud"><div class="base"></div>
 <div class="dialL"><svg id="speedDial2" viewBox="0 0 250 250"></svg><div class="dialMeta"><b id="speed">126</b><span id="unit">KM/H</span></div></div>
 <div class="dialR"><svg id="rpmDial2" viewBox="0 0 250 250"></svg><div class="dialMeta"><b id="rpmValue">4,620</b><span id="rpmUnit">RPM</span></div></div>
 <div class="center"><div class="modeRow"><div><div class="m" id="mode">MANUAL</div><div class="sel" id="selector">SPORT</div></div><div class="g" id="gear">4</div></div>
 <div class="metrics"><div class="box"><div class="k">ODO</div><div class="v" id="odo">31,842.6 km</div></div><div class="box"><div class="k">VEHICLE</div><div class="v" id="vehicle">CAR</div></div><div class="box"><div class="k">BOOST</div><div class="v"><span id="boost">0.5</span> bar</div></div></div>
 <div class="metrics"><div class="box"><div class="k">ENGINE</div><div class="v"><span id="engineHealth">92</span>%</div></div><div class="box"><div class="k">GEARBOX</div><div class="v"><span id="gearboxHealth">87</span>%</div></div><div class="box"><div class="k">FUEL</div><div class="v"><span id="fuel">64</span>%</div></div></div>
 <div class="bars"><div class="barBox"><div class="barHead"><span>THROTTLE</span><b id="thrPct">48%</b></div><div class="bb"><i id="thrBar"></i></div><div class="barHead" style="margin-top:8px"><span>BRAKE</span><b id="brkPct">6%</b></div><div class="bb"><i id="brkBar"></i></div></div><div class="barBox"><div class="barHead"><span>OIL TEMP</span><b id="oilTemp">94°</b></div><div class="bb"><i id="oilTempBar"></i></div><div class="barHead" style="margin-top:8px"><span>CLUTCH</span><b id="clutch">28%</b></div><div class="bb"><i id="clutchBar"></i></div></div></div>
 <div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div></div>
 <div class="overlay" id="overlay"><b id="overlayText">ENGINE OFF</b></div>
</div>
<div class="demo-panel"><h4>DEMO</h4>
<label>Speed <input data-key="speedKmH" type="range" min="0" max="420" value="126"><output>126</output></label>
<label>RPM <input data-key="physicalRPM" type="range" min="0" max="18000" value="4620"><output>4620</output></label>
<label>Norm RPM <input data-key="normalizedRPM" type="range" min="0" max="1.2" step="0.01" value="0.56"><output>0.56</output></label>
<label>Gear <input data-key="gear" type="range" min="-1" max="12" value="4"><output>4</output></label>
<label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="64"><output>64</output></label>
<label>Oil Temp <input data-key="oilTemperature" type="range" min="0" max="160" value="94"><output>94</output></label>
<label>Oil Life <input data-key="oilLife" type="range" min="0" max="100" value="81"><output>81</output></label>
<label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="28"><output>28</output></label>
<label>Boost <input data-key="boost" type="range" min="-1" max="3" step="0.1" value="0.5"><output>0.5</output></label>
<label>Throttle <input data-key="throttle" type="range" min="0" max="1" step="0.01" value="0.48"><output>0.48</output></label>
<label>Brake <input data-key="brake" type="range" min="0" max="1" step="0.01" value="0.06"><output>0.06</output></label>
<label>Eng Health <input data-key="engineHealth" type="range" min="0" max="100" value="92"><output>92</output></label>
<label>GB Health <input data-key="gearboxHealth" type="range" min="0" max="100" value="87"><output>87</output></label>
<h4>TOGGLES</h4><div id="demoButtons"></div>
<h4>PRESET</h4><button data-preset="city">CITY</button><button data-preset="sport">SPORT</button><button data-preset="truck">TRUCK</button><button data-preset="moto">MOTO</button><button data-preset="ev">EV</button><button id="unitBtn">KM/H ↔ MPH</button></div><script>(()=>{'use strict';
const K=.621371,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));
const state={speedKmH:126,normalizedRPM:.56,physicalRPM:4620,redlineRPM:7600,fuel:64,oilTemperature:94,oilLife:81,engineHealth:92,gearboxHealth:87,clutchHeat:28,boost:.5,odometerKm:31842.6,throttle:.48,brake:.06,maximumSpeedKmH:320,gear:4,maxGear:7,transmissionMode:0,automaticSelector:null,motorcycle:false,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:1,modelHash:0x1A2B3C4D};
let unit='kmh';
function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}
function speedValue(){return state.speedKmH*(unit==='mph'?K:1)}
function odoValue(){return state.odometerKm*(unit==='mph'?K:1)}
function modeLabel(){return ['MANUAL','AUTO','SEQUENTIAL'][state.transmissionMode]||`MODE ${state.transmissionMode}`}
function vehicleLabel(){if(state.electric) return state.motorcycle?'E-MOTO':'EV'; return state.motorcycle?'MOTO':'CAR';}
function lamp(id,en,on){const e=$(id); if(!e) return; e.classList.toggle('enabled',!!en); e.classList.toggle('active',!!on)}
function setText(id,val){const e=$(id); if(e) e.textContent=val}
function setWidth(id,p){const e=$(id); if(e) e.style.width=clamp(p,0,100)+'%'}
function setHeight(id,p){const e=$(id); if(e) e.style.height=clamp(p,0,100)+'%'}
function setRotate(id,deg){const e=$(id); if(e) e.style.transform=`rotate(${deg}deg)`}
const Dash={update(p={}){Object.assign(state,p);render()},setVehicle(p={}){Object.assign(state,p);render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return {...state,unit}}};
window.Dash=Dash;
window.addEventListener('message',e=>{const m=e.data||{}; if(m.type==='updateHud') Dash.update(m.data||{}); else if(m.type==='setVehicle') Dash.setVehicle(m.data||{}); else if(m.type==='setUnit') Dash.setUnit(m.data?.unit); else if(m.type==='setVisible') Dash.setVisible(m.visible ?? m.data?.visible);});
function initDemo(){document.querySelectorAll('[data-key]').forEach(i=>{const out=i.nextElementSibling; if(out&&out.tagName==='OUTPUT') out.value=i.value; i.addEventListener('input',()=>{state[i.dataset.key]=Number(i.value); if(out&&out.tagName==='OUTPUT') out.value=i.value; render();});}); const box=$('demoButtons'); if(box){const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric']; toggles.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.classList.toggle('on',!!state[k]); b.onclick=()=>{state[k]=!state[k]; b.classList.toggle('on',!!state[k]); render();}; box.appendChild(b);});}
 const presets={city:{maximumSpeedKmH:180,redlineRPM:6500,maxGear:5,electric:false,motorcycle:false},sport:{maximumSpeedKmH:340,redlineRPM:8500,maxGear:7,electric:false,motorcycle:false},truck:{maximumSpeedKmH:150,redlineRPM:4200,maxGear:12,electric:false,motorcycle:false},moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},ev:{maximumSpeedKmH:250,redlineRPM:18000,maxGear:1,electric:true,motorcycle:false}};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]||{})); const ub=$('unitBtn'); if(ub) ub.onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh'); if(new URLSearchParams(location.search).has('game')) document.body.classList.add('game'); render();}

const NS='http://www.w3.org/2000/svg';
function pol(cx,cy,r,a){const rad=(a-90)*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}}
function drawDial(svgId,maxVal,labelFn,needleCls){const svg=$(svgId); svg.innerHTML=''; const cx=125,cy=125,start=-140,end=140; for(let v=0; v<=maxVal+1e-6; v+=maxVal/8){const a=start+(v/maxVal)*(end-start); let p1=pol(cx,cy,84,a), p2=pol(cx,cy,105,a), pl=pol(cx,cy,70,a); const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',p1.x); ln.setAttribute('y1',p1.y); ln.setAttribute('x2',p2.x); ln.setAttribute('y2',p2.y); ln.setAttribute('class','tickA'); svg.appendChild(ln); const tx=document.createElementNS(NS,'text'); tx.setAttribute('x',pl.x); tx.setAttribute('y',pl.y+4); tx.setAttribute('class','dialNum'); tx.textContent=labelFn(v); svg.appendChild(tx); if(v<maxVal){for(let i=1;i<5;i++){const mv=v+maxVal/8*i/5, ma=start+(mv/maxVal)*(end-start); p1=pol(cx,cy,92,ma); p2=pol(cx,cy,105,ma); const m=document.createElementNS(NS,'line'); m.setAttribute('x1',p1.x);m.setAttribute('y1',p1.y);m.setAttribute('x2',p2.x);m.setAttribute('y2',p2.y);m.setAttribute('class','tickB'); svg.appendChild(m);}}} const nd=document.createElementNS(NS,'line'); nd.setAttribute('id',svgId+'Needle'); nd.setAttribute('x1',125); nd.setAttribute('y1',125); nd.setAttribute('x2',125); nd.setAttribute('y2',43); nd.setAttribute('class',needleCls); svg.appendChild(nd); const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',125); c.setAttribute('cy',125); c.setAttribute('r',9); c.setAttribute('class','hub'); svg.appendChild(c); }
function render(){ const spMax=Math.max(60, state.maximumSpeedKmH*(unit==='mph'?K:1)); drawDial('speedDial2', spMax, v=>Math.round(v), 'ndA'); const rpmMax=state.electric?100:Math.max(1000,Math.ceil((state.redlineRPM||7000)/1000)*1000); drawDial('rpmDial2', state.electric?100:rpmMax, v=>state.electric?Math.round(v):Math.round(v/1000), 'ndB'); const sp=speedValue(); setText('speed', String(Math.round(sp)).padStart(3,'0')); setText('unit', unit==='mph'?'MPH':'KM/H'); $('speedDial2Needle').style.transformOrigin='125px 125px'; $('speedDial2Needle').style.transform=`rotate(${-140 + clamp(sp/spMax,0,1.15)*280}deg)`; const rv=state.electric?Math.round(clamp(state.normalizedRPM,0,1)*100):Math.round(state.physicalRPM||0); setText('rpmValue', rv.toLocaleString()); setText('rpmUnit', state.electric?'POWER %':'RPM'); $('rpmDial2Needle').style.transformOrigin='125px 125px'; $('rpmDial2Needle').style.transform=`rotate(${-140 + clamp((state.electric?rv:(state.physicalRPM||0))/(state.electric?100:rpmMax),0,1.15)*280}deg)`;
 setText('mode',modeLabel()); setText('selector', state.automaticSelector || (state.launchControl?'LAUNCH':state.transmissionMode===1?'AUTO':'CRUISE')); setText('gear',gearLabel()); setText('odo',`${odoValue().toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`); setText('vehicle',vehicleLabel()); setText('boost',Number(state.boost||0).toFixed(1)); setText('engineHealth',toPct(state.engineHealth)); setText('gearboxHealth',toPct(state.gearboxHealth)); setText('fuel',toPct(state.fuel)); const thr=toPct(state.throttle), brk=toPct(state.brake); setText('thrPct',thr+'%'); setWidth('thrBar',thr); $('thrBar').style.background='linear-gradient(90deg,#66d6ff,var(--cyan))'; setText('brkPct',brk+'%'); setWidth('brkBar',brk); $('brkBar').style.background='linear-gradient(90deg,#ff916f,var(--red))'; const temp=Math.round(state.oilTemperature||0); setText('oilTemp',temp+'°'); setWidth('oilTempBar',clamp(temp/150*100,0,100)); $('oilTempBar').style.background=temp>125?'linear-gradient(90deg,#ff916f,var(--red))':temp>110?'linear-gradient(90deg,#ffd788,var(--amber))':'linear-gradient(90deg,#66d6ff,var(--cyan))'; const clutch=toPct(state.clutchHeat); setText('clutch',clutch+'%'); setWidth('clutchBar',clutch); $('clutchBar').style.background=clutch>75?'linear-gradient(90deg,#ff916f,var(--red))':clutch>50?'linear-gradient(90deg,#ffd788,var(--amber))':'linear-gradient(90deg,#8ef7ab,var(--green))';
 lamp('lABS',state.absEnabled,state.absActive); lamp('lTCS',state.tcsEnabled,state.tcsActive); lamp('lESC',state.escEnabled,state.escActive); lamp('lPB',true,state.parkingBrake); lamp('lLC',state.launchEnabled,state.launchControl); lamp('lBurn',true,state.burnout); lamp('lRoll',true,state.rollWarning); const ov=$('overlay'), txt=$('overlayText'); ov.classList.toggle('on', !state.engineOn || state.engineStarting); txt.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF'; txt.classList.toggle('starting',state.engineStarting);} initDemo();
})();</script></body></html>
