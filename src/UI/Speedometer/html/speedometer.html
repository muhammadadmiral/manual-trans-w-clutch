<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>MT HUD - Analog</title>
<style>
  :root{
    --bg-face:#141414; --bg-face2:#0b0b0b;
    --bezel1:#5a5a58; --bezel2:#2a2a29;
    --ivory:#e9e4d6; --ivory-dim:#8b877a;
    --brass:#e0a24a; --brass-dim:#8a6b34;
    --red:#c6362b; --green-ok:#5fae6a; --amber:#e0a24a;
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    font-family:"Arial Narrow",Arial,sans-serif;}
  #wrap{position:relative;width:900px;height:420px;}
  svg{width:100%;height:100%;display:block;overflow:visible;}
  text{user-select:none;}
  .tick-major{stroke:var(--ivory);stroke-width:3;}
  .tick-minor{stroke:var(--ivory-dim);stroke-width:1.5;}
  .tick-label{fill:var(--ivory);font-size:22px;font-weight:700;text-anchor:middle;
    letter-spacing:.5px;}
  .unit-label{fill:var(--ivory-dim);font-size:13px;text-anchor:middle;letter-spacing:3px;
    font-weight:700;}
  .needle{fill:var(--brass);filter:drop-shadow(0 0 3px rgba(224,162,74,.6));}
  .needle-cap{fill:#1c1c1a;stroke:var(--brass-dim);stroke-width:2;}
  .redzone{stroke:var(--red);stroke-width:9;fill:none;opacity:.9;}
  .dial-rim{fill:none;stroke:url(#bezelGrad);stroke-width:10;}
  .gear-box{fill:#191917;stroke:var(--bezel1);stroke-width:2;}
  .gear-text{fill:var(--brass);font-size:58px;font-weight:900;text-anchor:middle;
    font-family:Consolas,"Courier New",monospace;filter:drop-shadow(0 0 4px rgba(224,162,74,.5));}
  .info-text{fill:var(--ivory-dim);font-size:12px;text-anchor:middle;letter-spacing:1.5px;}
  .bar-bg{fill:#242422;}
  .bar-fuel{fill:#5fa3c9;}
  .bar-oil{fill:#c9793f;}
  .bar-clutch{fill:var(--green-ok);}
  .bar-label{fill:var(--ivory-dim);font-size:10px;letter-spacing:1px;}
  .warn{fill:#3a3a37;font-size:15px;font-weight:800;text-anchor:middle;
    font-family:Consolas,monospace;letter-spacing:1px;}
  .warn.active{fill:var(--amber);}
  .warn.active.danger{fill:var(--red);}
  #offOverlay{fill:#000;opacity:0;pointer-events:none;transition:opacity .4s;}
  #offOverlay.dim{opacity:.72;}

  .demo-panel{position:fixed;top:8px;right:8px;background:#141414;color:#ddd;
    padding:10px;font:11px Consolas,monospace;border-radius:6px;max-height:96vh;
    overflow:auto;border:1px solid #333;width:230px;}
  .demo-panel h4{margin:8px 0 2px;color:#e0a24a;font-size:11px;border-bottom:1px solid #333;}
  .demo-panel label{display:flex;justify-content:space-between;margin-top:5px;gap:6px;}
  .demo-panel input[type=range]{width:120px;}
  .demo-panel button{margin:2px 2px 0 0;background:#222;color:#ddd;border:1px solid #444;
    border-radius:4px;padding:3px 6px;cursor:pointer;font:11px Consolas,monospace;}
  .demo-panel button.on{background:#e0a24a;color:#141414;}
</style>
</head>
<body>
<div id="wrap">
<svg id="svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="var(--bg-face)"/>
      <stop offset="100%" stop-color="var(--bg-face2)"/>
    </radialGradient>
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--bezel1)"/>
      <stop offset="50%" stop-color="var(--bezel2)"/>
      <stop offset="100%" stop-color="var(--bezel1)"/>
    </linearGradient>
  </defs>

  <!-- TACHO -->
  <g id="tachoGroup" transform="translate(195,213)">
    <circle r="167" fill="url(#faceGrad)"/>
    <circle class="dial-rim" r="169"/>
    <path id="redzone" class="redzone"/>
    <g id="tachoTicks"></g>
    <g id="tachoNeedle"><path class="needle" d="M -4,12 L 0,-142 L 4,12 Z"/></g>
    <circle class="needle-cap" r="15"/>
    <text class="unit-label" y="72">RPM &times;1000</text>
  </g>

  <!-- SPEEDO -->
  <g id="speedoGroup" transform="translate(705,213)">
    <circle r="167" fill="url(#faceGrad)"/>
    <circle class="dial-rim" r="169"/>
    <g id="speedoTicks"></g>
    <g id="speedoNeedle"><path class="needle" d="M -4,12 L 0,-142 L 4,12 Z"/></g>
    <circle class="needle-cap" r="15"/>
    <text id="speedoUnitLabel" class="unit-label" y="72">KM/H</text>
  </g>

  <!-- CENTER INFO -->
  <g transform="translate(450,205)">
    <rect class="gear-box" x="-58" y="-72" width="116" height="82" rx="8"/>
    <text id="gearText" class="gear-text" y="-2">N</text>
    <text id="modeText" class="info-text" y="24">MANUAL</text>

    <text id="odoText" class="info-text" y="52" font-size="13" fill="#e9e4d6" font-weight="700">0 km</text>

    <text class="bar-label" x="-70" y="76" text-anchor="start">FUEL</text>
    <rect class="bar-bg" x="-70" y="80" width="140" height="7" rx="3"/>
    <rect id="fuelBar" class="bar-fuel" x="-70" y="80" width="0" height="7" rx="3"/>

    <text class="bar-label" x="-70" y="99" text-anchor="start">OIL TEMP</text>
    <rect class="bar-bg" x="-70" y="103" width="140" height="7" rx="3"/>
    <rect id="oilBar" class="bar-oil" x="-70" y="103" width="0" height="7" rx="3"/>

    <text class="bar-label" x="-70" y="122" text-anchor="start">CLUTCH</text>
    <rect class="bar-bg" x="-70" y="126" width="140" height="7" rx="3"/>
    <rect id="clutchBar" class="bar-clutch" x="-70" y="126" width="0" height="7" rx="3"/>

    <g id="warnRow" transform="translate(0,158)">
      <text id="wABS" class="warn" x="-98">ABS</text>
      <text id="wTCS" class="warn" x="-49">TCS</text>
      <text id="wESC" class="warn" x="2">ESC</text>
      <text id="wPB" class="warn" x="46">PB</text>
      <text id="wLC" class="warn" x="98">LC</text>
    </g>
  </g>

  <rect id="offOverlayTacho" class="off-overlay" x="28" y="46" width="335" height="335" rx="170" fill="#000" opacity="0"/>
  <rect id="offOverlaySpeedo" class="off-overlay" x="538" y="46" width="335" height="335" rx="170" fill="#000" opacity="0"/>
</svg>
</div>

<div class="demo-panel" id="demoPanel">
  <h4>DEMO CONTROLS</h4>
  <label>Speed <input id="dSpeed" type="range" min="0" max="400" value="0"></label>
  <label>RPM <input id="dRpm" type="range" min="0" max="16000" value="900"></label>
  <label>Gear <input id="dGear" type="range" min="-1" max="8" value="0"></label>
  <label>Fuel <input id="dFuel" type="range" min="0" max="100" value="70"></label>
  <label>Oil Temp <input id="dOilTemp" type="range" min="0" max="140" value="85"></label>
  <label>Clutch Heat <input id="dClutch" type="range" min="0" max="100" value="10"></label>
  <h4>WARNINGS</h4>
  <button id="tABS">ABS</button><button id="tTCS">TCS</button>
  <button id="tESC">ESC</button><button id="tPB">Park Brake</button>
  <button id="tLC">Launch Ctrl</button><button id="tEngine" class="on">Engine ON</button>
  <h4>UNIT</h4>
  <button id="tUnit">KM/H &#8644; MPH</button>
  <h4>VEHICLE PRESET</h4>
  <button data-max="180" data-red="6500" data-gear="5">City 180/6500</button>
  <button data-max="320" data-red="8500" data-gear="7">Sport 320/8500</button>
  <button data-max="140" data-red="4500" data-gear="6">Truck 140/4500</button>
  <button data-max="299" data-red="14000" data-gear="6">Moto 299/14000</button>
</div>

<script>
(function(){
  const START_ANGLE=-130, END_ANGLE=130, KMH_TO_MPH=0.621371;
  // Rentang mentah asumsi native FiveM - SESUAIKAN dengan sumber data lu:
  const RANGES={fuel:[0,100], oilTemperature:[0,140], clutchHeat:[0,100]};

  const state={ speedKmH:0, physicalRPM:900, gear:0, transmissionMode:0,
    automaticSelector:null, fuel:70, oilTemperature:85, clutchHeat:10,
    odometerKm:0, engineOn:true, parkingBrake:false, tcsActive:false,
    absActive:false, escActive:false, launchControl:false };

  const cfg={ maximumSpeedKmH:180, redlineRPM:6500, maxGear:5, unit:'kmh',
    speedScaleMax:180, rpmScaleMax:8000 };

  const $=id=>document.getElementById(id);
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function toRad(a){return (a-90)*Math.PI/180;}
  function polar(r,angle){const rad=toRad(angle);return {x:r*Math.cos(rad), y:r*Math.sin(rad)};}
  function arcPath(r,a0,a1){
    const p0=polar(r,a1), p1=polar(r,a0);
    const large=(a1-a0)<=180?0:1;
    return `M ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 0 ${p1.x} ${p1.y}`;
  }
  function niceStep(max,targetTicks){
    const rough=max/targetTicks;
    const mag=Math.pow(10,Math.floor(Math.log10(rough||1)));
    const norm=rough/mag;
    let step; if(norm<1.5) step=1; else if(norm<3) step=2; else if(norm<7) step=5; else step=10;
    return step*mag;
  }
  function buildTicks(maxValue, majorStep, minorPer){
    const top=Math.ceil(maxValue/majorStep)*majorStep;
    const arr=[];
    for(let v=0; v<=top+1e-6; v+=majorStep){
      arr.push({value:v,major:true});
      if(v+majorStep<=top+1e-6 && minorPer>1){
        for(let i=1;i<minorPer;i++) arr.push({value:v+(majorStep*i/minorPer),major:false});
      }
    }
    return {ticks:arr, top};
  }
  function renderDial(groupTicksEl, ticks, labelFmt){
    let html='';
    for(const t of ticks){
      const angle=START_ANGLE+(t.value/(ticks._top))*(END_ANGLE-START_ANGLE);
      if(t.major){
        const p1=polar(135,angle), p2=polar(158,angle), pl=polar(112,angle);
        html+=`<line class="tick-major" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;
        html+=`<text class="tick-label" x="${pl.x}" y="${pl.y+7}">${labelFmt(t.value)}</text>`;
      } else {
        const p1=polar(146,angle), p2=polar(158,angle);
        html+=`<line class="tick-minor" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;
      }
    }
    groupTicksEl.innerHTML=html;
  }

  function rebuildScales(){
    const speedStep=niceStep(cfg.maximumSpeedKmH * (cfg.unit==='mph'?KMH_TO_MPH:1), 8);
    const speedMaxDisplay=cfg.maximumSpeedKmH * (cfg.unit==='mph'?KMH_TO_MPH:1);
    const sp=buildTicks(speedMaxDisplay, speedStep, 4);
    sp.ticks._top=sp.top; cfg.speedScaleMax=sp.top; // dalam unit yang sedang ditampilkan
    renderDial($('speedoTicks'), sp.ticks, v=>Math.round(v));
    $('speedoUnitLabel').textContent = cfg.unit==='mph' ? 'MPH' : 'KM/H';

    const rpmDisplayMaxK=Math.ceil((cfg.redlineRPM*1.12)/1000);
    const rpmStepK=niceStep(rpmDisplayMaxK,8);
    const rp=buildTicks(rpmDisplayMaxK, rpmStepK, 4);
    rp.ticks._top=rp.top; cfg.rpmScaleMax=rp.top*1000;
    renderDial($('tachoTicks'), rp.ticks, v=>v);

    const redA0=START_ANGLE+(cfg.redlineRPM/cfg.rpmScaleMax)*(END_ANGLE-START_ANGLE);
    $('redzone').setAttribute('d', arcPath(178, redA0, END_ANGLE));
    // reposition redzone relative to group translate (170,-... ) - group already translated, path uses local coords
  }

  function gearLabel(){
    if(cfg.transmissionMode===1 && state.automaticSelector) return state.automaticSelector;
    if(state.gear<0) return 'R';
    if(state.gear===0) return 'N';
    return String(state.gear);
  }
  function pctBar(val,range){ return clamp((val-range[0])/(range[1]-range[0]),0,1)*140; }

  function render(){
    const rpm=clamp(state.physicalRPM,0,cfg.rpmScaleMax);
    const rpmAngle=START_ANGLE+(rpm/cfg.rpmScaleMax)*(END_ANGLE-START_ANGLE);
    $('tachoNeedle').setAttribute('transform',`rotate(${rpmAngle})`);

    const speedDisp = cfg.unit==='mph' ? state.speedKmH*KMH_TO_MPH : state.speedKmH;
    const speedAngle=START_ANGLE+(clamp(speedDisp,0,cfg.speedScaleMax)/cfg.speedScaleMax)*(END_ANGLE-START_ANGLE);
    $('speedoNeedle').setAttribute('transform',`rotate(${speedAngle})`);

    $('gearText').textContent=gearLabel();
    $('modeText').textContent = cfg.transmissionMode===1 ? 'AUTOMATIC' : 'MANUAL';
    const odo = cfg.unit==='mph' ? state.odometerKm*KMH_TO_MPH : state.odometerKm;
    $('odoText').textContent = Math.round(odo).toLocaleString() + (cfg.unit==='mph'?' mi':' km');

    $('fuelBar').setAttribute('width', pctBar(state.fuel, RANGES.fuel));
    $('oilBar').setAttribute('width', pctBar(state.oilTemperature, RANGES.oilTemperature));
    $('clutchBar').setAttribute('width', pctBar(state.clutchHeat, RANGES.clutchHeat));
    const clutchPct=pctBar(state.clutchHeat,RANGES.clutchHeat)/140;
    $('clutchBar').setAttribute('fill', clutchPct>0.85?'var(--red)':clutchPct>0.6?'var(--amber)':'var(--green-ok)');

    setWarn('wABS', state.absActive);
    setWarn('wTCS', state.tcsActive);
    setWarn('wESC', state.escActive);
    setWarn('wPB', state.parkingBrake, true);
    setWarn('wLC', state.launchControl);

    const dim = !state.engineOn;
    $('offOverlayTacho').setAttribute('opacity', dim?0.72:0);
    $('offOverlaySpeedo').setAttribute('opacity', dim?0.72:0);
  }
  function setWarn(id, active, danger){
    const el=$(id);
    el.classList.toggle('active', !!active);
    el.classList.toggle('danger', !!(active&&danger));
  }

  const Dash={
    update(partial){ Object.assign(state, partial); render(); },
    setVehicle({maximumSpeedKmH, redlineRPM, maxGear}={}){
      if(maximumSpeedKmH) cfg.maximumSpeedKmH=maximumSpeedKmH;
      if(redlineRPM) cfg.redlineRPM=redlineRPM;
      if(maxGear) cfg.maxGear=maxGear;
      rebuildScales(); render();
    },
    setUnit(unit){ cfg.unit=unit; rebuildScales(); render(); }
  };
  window.Dash=Dash;

  // Konvensi FiveM NUI: game kirim postMessage ke iframe ini.
  // ui.performHttpRequest / SendNUIMessage(data) di lua -> event.data di sini.
  window.addEventListener('message', function(ev){
    const m=ev.data||{};
    if(m.type==='updateHud') Dash.update(m.data);
    else if(m.type==='setVehicle') Dash.setVehicle(m.data);
    else if(m.type==='setUnit') Dash.setUnit(m.data.unit);
  });

  // ---- demo panel wiring (hapus div#demoPanel saat integrasi ke game) ----
  $('dSpeed').oninput=e=>Dash.update({speedKmH:+e.target.value});
  $('dRpm').oninput=e=>Dash.update({physicalRPM:+e.target.value});
  $('dGear').oninput=e=>Dash.update({gear:+e.target.value});
  $('dFuel').oninput=e=>Dash.update({fuel:+e.target.value});
  $('dOilTemp').oninput=e=>Dash.update({oilTemperature:+e.target.value});
  $('dClutch').oninput=e=>Dash.update({clutchHeat:+e.target.value});
  function toggleBtn(id, key){
    $(id).onclick=()=>{ state[key]=!state[key]; $(id).classList.toggle('on', state[key]); render(); };
  }
  toggleBtn('tABS','absActive'); toggleBtn('tTCS','tcsActive'); toggleBtn('tESC','escActive');
  toggleBtn('tPB','parkingBrake'); toggleBtn('tLC','launchControl');
  $('tEngine').onclick=()=>{ state.engineOn=!state.engineOn; $('tEngine').classList.toggle('on',state.engineOn); render(); };
  $('tUnit').onclick=()=>Dash.setUnit(cfg.unit==='mph'?'kmh':'mph');
  document.querySelectorAll('[data-max]').forEach(b=>{
    b.onclick=()=>Dash.setVehicle({maximumSpeedKmH:+b.dataset.max, redlineRPM:+b.dataset.red, maxGear:+b.dataset.gear});
  });

  rebuildScales(); render();
})();
</script>
</body>
</html>
