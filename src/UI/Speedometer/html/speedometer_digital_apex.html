<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT HUD — Digital Apex</title>
<style>
:root{--scale:1;--bg:#05090d;--panel:#0a1117;--panel2:#0d1820;--line:#20323d;--text:#eef8fc;--muted:#71858f;--cyan:#29ddff;--blue:#508dff;--green:#58e898;--amber:#ffb83f;--red:#ff4655}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}body{display:grid;place-items:end center;padding-bottom:24px}
#hud{position:relative;width:1080px;height:360px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 18px 30px rgba(0,0,0,.58))}#hud.hidden{opacity:0;transform:scale(calc(var(--scale)*.96)) translateY(18px)}
.shell{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,24,31,.97),rgba(4,8,11,.96));border:1px solid rgba(41,221,255,.18);clip-path:polygon(5% 0,95% 0,100% 13%,98% 93%,92% 100%,8% 100%,2% 93%,0 13%);box-shadow:inset 0 1px rgba(255,255,255,.05),inset 0 -70px 100px rgba(0,0,0,.34)}
.rpm-rail{position:absolute;left:66px;right:66px;top:18px;height:72px}.rpm-meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:900;letter-spacing:1.8px;color:var(--muted)}.rpm-meta b{font:800 15px Consolas,monospace;color:var(--text);letter-spacing:0}.rpm-meta .hot{color:var(--red)}
.rpm-track{position:relative;height:35px;margin-top:9px;display:grid;grid-template-columns:repeat(36,1fr);gap:3px;transform:skewX(-9deg)}.rpm-seg{background:#15242d;border-top:1px solid #233842;transition:.04s}.rpm-seg.on{background:var(--cyan);box-shadow:0 0 7px rgba(41,221,255,.42)}.rpm-seg.warn.on{background:var(--amber)}.rpm-seg.red.on{background:var(--red);box-shadow:0 0 9px rgba(255,70,85,.58)}
.main-grid{position:absolute;left:52px;right:52px;top:99px;height:194px;display:grid;grid-template-columns:238px 1fr 238px;gap:14px}.card{background:linear-gradient(180deg,rgba(14,27,35,.9),rgba(7,13,17,.93));border:1px solid var(--line);border-radius:14px;overflow:hidden}.card-title{height:29px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1b2b34;font-size:9px;font-weight:900;letter-spacing:1.4px;color:var(--muted)}.card-title b{color:var(--cyan)}
.telemetry{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 29px)}.metric{padding:11px;border-right:1px solid #182831;border-bottom:1px solid #182831}.metric:nth-child(2n){border-right:0}.metric:nth-child(n+3){border-bottom:0}.metric label{display:block;font-size:8px;font-weight:900;letter-spacing:1px;color:var(--muted)}.metric strong{display:block;margin-top:5px;font:800 18px Consolas,monospace}.metric strong small{font:700 8px Inter;color:var(--muted)}.micro{height:4px;background:#17262e;border-radius:4px;margin-top:7px;overflow:hidden}.micro i{display:block;height:100%;width:0;background:var(--green)}
.core{position:relative;display:grid;grid-template-columns:128px 1fr 122px;align-items:center}.core:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(41,221,255,.08),transparent 55%);pointer-events:none}.gear-zone{text-align:center;border-right:1px solid #1f3039}.gear-zone label,.speed-zone label,.boost-zone label{font-size:9px;font-weight:900;letter-spacing:1.6px;color:var(--muted)}#gear{font:950 88px/.85 "Arial Narrow",Inter;color:var(--cyan);text-shadow:0 0 22px rgba(41,221,255,.36)}#selector{min-height:13px;margin-top:8px;font-size:10px;font-weight:900;letter-spacing:2px;color:var(--amber)}
.speed-zone{text-align:center}.speed-number{display:flex;justify-content:center;align-items:flex-end;line-height:1}#speed{font:950 102px/.8 "Arial Narrow",Inter;letter-spacing:-5px}.unit{margin-left:8px;margin-bottom:10px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:900;letter-spacing:2px;color:var(--muted)}#odo{margin-top:12px;font:700 10px Consolas;color:var(--muted)}
.boost-zone{text-align:center;border-left:1px solid #1f3039}.boost-dial{width:82px;height:82px;margin:10px auto 4px;border-radius:50%;background:conic-gradient(var(--cyan) 0deg,#17262e 0deg);display:grid;place-items:center;position:relative}.boost-dial:after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;background:#091218}.boost-dial div{position:relative;z-index:1}.boost-dial b{display:block;font:800 22px Consolas}.boost-dial small{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:1px}
.bottom{position:absolute;left:60px;right:60px;bottom:16px;height:47px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.input-head{display:flex;justify-content:space-between;font-size:8px;font-weight:900;letter-spacing:1px;color:var(--muted)}.input-track{height:7px;background:#16252d;border-radius:5px;margin-top:4px;overflow:hidden}.input-track i{display:block;height:100%;width:0}.input-track .thr{background:linear-gradient(90deg,#159db8,var(--cyan))}.input-track .brk{background:linear-gradient(90deg,#ba2e3b,var(--red))}
.lamps{display:flex;gap:5px}.lamp{height:23px;min-width:41px;padding:0 7px;border:1px solid #263943;border-radius:5px;display:flex;align-items:center;justify-content:center;background:#091116;color:#40545e;font-size:8px;font-weight:900;letter-spacing:.5px}.lamp.enabled{color:#81939b}.lamp.active{background:var(--cyan);border-color:var(--cyan);color:#061015;box-shadow:0 0 10px rgba(41,221,255,.4)}.lamp.warn.active{background:var(--amber);border-color:var(--amber)}.lamp.danger.active{background:var(--red);border-color:var(--red);color:#fff}.meta{text-align:right;font:700 8px/1.45 Consolas;color:#50636c}.meta b{color:#aabcc3}
.engine-overlay{position:absolute;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.2s}.engine-overlay.on{opacity:1}.engine-message{font-size:14px;font-weight:900;letter-spacing:7px;color:#71858f}.engine-message.starting{color:var(--amber);animation:pulse .55s infinite alternate}@keyframes pulse{to{opacity:.3}}
.demo-panel{position:fixed;top:10px;right:10px;width:270px;max-height:calc(100vh - 20px);overflow:auto;padding:10px 12px;border:1px solid #31434c;border-radius:12px;background:rgba(7,11,14,.95);color:#dce7eb;font:11px/1.35 Consolas;z-index:5}.demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px}.demo-panel label{display:grid;grid-template-columns:92px 1fr 42px;gap:5px;align-items:center;margin:4px 0}.demo-panel input{width:100%}.demo-panel button{border:1px solid #344852;background:#10191e;color:#9aacb3;border-radius:5px;padding:4px 7px;margin:2px;cursor:pointer;font:10px Consolas}.demo-panel button.on{background:var(--cyan);color:#061015;border-color:var(--cyan)}body.game .demo-panel{display:none}
@media(max-width:1150px){:root{--scale:.82}}@media(max-width:900px){:root{--scale:.64}}
</style>
</head>
<body>
<div id="hud">
 <div class="shell"></div>
 <div class="rpm-rail"><div class="rpm-meta"><span id="rpmName">ENGINE RPM</span><b id="rpmValue">4,200</b><span>REDLINE <b class="hot" id="redline">7000</b></span></div><div class="rpm-track" id="rpmTrack"></div></div>
 <div class="main-grid">
  <section class="card"><div class="card-title"><span>FLUID / THERMAL</span><b id="mode">MANUAL</b></div><div class="telemetry">
   <div class="metric"><label>FUEL</label><strong><span id="fuel">68</span><small> %</small></strong><div class="micro"><i id="fuelBar"></i></div></div>
   <div class="metric"><label>OIL TEMP</label><strong><span id="oilTemp">96</span><small> °C</small></strong><div class="micro"><i id="oilTempBar"></i></div></div>
   <div class="metric"><label>OIL LIFE</label><strong><span id="oilLife">82</span><small> %</small></strong><div class="micro"><i id="oilLifeBar"></i></div></div>
   <div class="metric"><label>CLUTCH</label><strong><span id="clutch">32</span><small> %</small></strong><div class="micro"><i id="clutchBar"></i></div></div>
  </div></section>
  <section class="card core"><div class="gear-zone"><label>GEAR</label><div id="gear">4</div><div id="selector"></div></div><div class="speed-zone"><label>VEHICLE SPEED</label><div class="speed-number"><span id="speed">096</span><span class="unit" id="unit">KM/H</span></div><div id="odo">ODO 12,843.7 km</div></div><div class="boost-zone"><label>BOOST</label><div class="boost-dial" id="boostDial"><div><b id="boost">0.8</b><small>BAR</small></div></div></div></section>
  <section class="card"><div class="card-title"><span>POWERTRAIN HEALTH</span><b id="vehicle">CAR</b></div><div class="telemetry">
   <div class="metric"><label>ENGINE</label><strong><span id="engineHealth">93</span><small> %</small></strong><div class="micro"><i id="engineBar"></i></div></div>
   <div class="metric"><label>GEARBOX</label><strong><span id="gearboxHealth">89</span><small> %</small></strong><div class="micro"><i id="gearboxBar"></i></div></div>
   <div class="metric"><label>MAX SPEED</label><strong><span id="maxSpeed">320</span><small id="maxUnit"> KM/H</small></strong></div>
   <div class="metric"><label>MAX GEAR</label><strong><span id="maxGear">6</span><small> SPD</small></strong></div>
  </div></section>
 </div>
 <div class="bottom"><div class="inputs"><div><div class="input-head"><span>THROTTLE</span><b id="thrPct">46%</b></div><div class="input-track"><i class="thr" id="thrBar"></i></div></div><div><div class="input-head"><span>BRAKE</span><b id="brkPct">0%</b></div><div class="input-track"><i class="brk" id="brkBar"></i></div></div></div><div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div><div class="meta">CLASS <b id="vclass">0</b> · HASH <b id="hash">1234ABCD</b><br>LAUNCH <b id="launchState">READY</b></div></div>
 <div class="engine-overlay" id="engineOverlay"><div class="engine-message" id="engineMessage">ENGINE OFF</div></div>
</div>
<div class="demo-panel"><h4>DIGITAL APEX — DEMO</h4>
<label>Speed <input data-key="speedKmH" type="range" min="0" max="420" value="96"><output>96</output></label><label>RPM <input data-key="physicalRPM" type="range" min="0" max="16000" value="4200"><output>4200</output></label><label>Gear <input data-key="gear" type="range" min="-1" max="8" value="4"><output>4</output></label><label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="68"><output>68</output></label><label>Oil temp <input data-key="oilTemperature" type="range" min="0" max="160" value="96"><output>96</output></label><label>Oil life <input data-key="oilLife" type="range" min="0" max="100" value="82"><output>82</output></label><label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="32"><output>32</output></label><label>Boost <input data-key="boost" type="range" step="0.1" min="-1" max="3" value="0.8"><output>0.8</output></label><label>Throttle <input data-key="throttle" type="range" step="0.01" min="0" max="1" value="0.46"><output>0.46</output></label><label>Brake <input data-key="brake" type="range" step="0.01" min="0" max="1" value="0"><output>0</output></label><label>Engine <input data-key="engineHealth" type="range" min="0" max="100" value="93"><output>93</output></label><label>Gearbox <input data-key="gearboxHealth" type="range" min="0" max="100" value="89"><output>89</output></label><h4>STATE</h4><div id="demoButtons"></div><h4>PRESET</h4><button data-preset="city">CITY</button><button data-preset="sport">SPORT</button><button data-preset="truck">TRUCK</button><button data-preset="moto">MOTO</button><button data-preset="ev">EV</button><button id="unitBtn">KM/H ↔ MPH</button></div>
<script>
(()=>{'use strict';
const K=.621371,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));
const state={speedKmH:96,normalizedRPM:.6,physicalRPM:4200,redlineRPM:7000,fuel:68,oilTemperature:96,oilLife:82,engineHealth:93,gearboxHealth:89,clutchHeat:32,boost:.8,odometerKm:12843.7,throttle:.46,brake:0,maximumSpeedKmH:320,gear:4,maxGear:6,transmissionMode:0,automaticSelector:null,motorcycle:false,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:0,modelHash:0x1234ABCD};let unit='kmh';
for(let i=0;i<36;i++){const s=document.createElement('i');s.className='rpm-seg';$('rpmTrack').appendChild(s)}
function bar(id,v,color){const e=$(id);e.style.width=clamp(v,0,100)+'%';e.style.background=color||(v<30?'var(--red)':v<60?'var(--amber)':'var(--green)')}
function lamp(id,en,on){const e=$(id);e.classList.toggle('enabled',!!en);e.classList.toggle('active',!!on)}
function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}
function render(){
 const rpmNorm=state.electric?clamp(state.normalizedRPM,0,1.2):clamp((state.physicalRPM||0)/(state.redlineRPM||1),0,1.2),active=Math.round(clamp(rpmNorm,0,1)*36);document.querySelectorAll('.rpm-seg').forEach((s,i)=>{s.className='rpm-seg';if(i<active)s.classList.add('on');if(i>=28)s.classList.add('warn');if(i>=33)s.classList.add('red')});
 $('rpmName').textContent=state.electric?'POWER OUTPUT':'ENGINE RPM';$('rpmValue').textContent=state.electric?Math.round(rpmNorm*100)+'%':Math.round(state.physicalRPM||0).toLocaleString();$('redline').textContent=state.electric?'100%':Math.round(state.redlineRPM||0);
 const sp=state.speedKmH*(unit==='mph'?K:1);$('speed').textContent=Math.round(sp).toString().padStart(3,'0');$('unit').textContent=unit==='mph'?'MPH':'KM/H';$('odo').textContent=`ODO ${(state.odometerKm*(unit==='mph'?K:1)).toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`;$('gear').textContent=gearLabel();$('selector').textContent=state.automaticSelector||'';
 const boost=Number(state.boost||0),bp=clamp((boost+1)/4,0,1);$('boost').textContent=boost.toFixed(1);$('boostDial').style.background=`conic-gradient(var(--cyan) ${bp*360}deg,#17262e 0deg)`;
 const fuel=toPct(state.fuel),oilLife=toPct(state.oilLife),clutch=toPct(state.clutchHeat),eng=toPct(state.engineHealth),box=toPct(state.gearboxHealth),thr=toPct(state.throttle),brk=toPct(state.brake);$('fuel').textContent=fuel;$('oilTemp').textContent=Math.round(state.oilTemperature||0);$('oilLife').textContent=oilLife;$('clutch').textContent=clutch;$('engineHealth').textContent=eng;$('gearboxHealth').textContent=box;bar('fuelBar',fuel);bar('oilLifeBar',oilLife);bar('clutchBar',clutch,clutch>75?'var(--red)':clutch>50?'var(--amber)':'var(--green)');bar('oilTempBar',clamp((state.oilTemperature||0)/150*100,0,100),(state.oilTemperature||0)>125?'var(--red)':(state.oilTemperature||0)>110?'var(--amber)':'var(--green)');bar('engineBar',eng);bar('gearboxBar',box);
 $('thrPct').textContent=thr+'%';$('brkPct').textContent=brk+'%';$('thrBar').style.width=thr+'%';$('brkBar').style.width=brk+'%';$('mode').textContent=['MANUAL','AUTO','SEQUENTIAL'][state.transmissionMode]||`MODE ${state.transmissionMode}`;$('vehicle').textContent=state.electric?(state.motorcycle?'E-MOTO':'EV'):state.motorcycle?'MOTO':'CAR';$('maxSpeed').textContent=Math.round(state.maximumSpeedKmH*(unit==='mph'?K:1));$('maxUnit').textContent=' '+(unit==='mph'?'MPH':'KM/H');$('maxGear').textContent=state.maxGear||'—';$('vclass').textContent=state.vehicleClass;$('hash').textContent=(Number(state.modelHash)>>>0).toString(16).padStart(8,'0').toUpperCase();$('launchState').textContent=state.launchControl?'ACTIVE':state.launchEnabled?'READY':'OFF';
 lamp('lABS',state.absEnabled,state.absActive);lamp('lTCS',state.tcsEnabled,state.tcsActive);lamp('lESC',state.escEnabled,state.escActive);lamp('lPB',true,state.parkingBrake);lamp('lLC',state.launchEnabled,state.launchControl);lamp('lBurn',true,state.burnout);lamp('lRoll',true,state.rollWarning);
 const ov=$('engineOverlay'),msg=$('engineMessage');ov.classList.toggle('on',!state.engineOn||state.engineStarting);msg.classList.toggle('starting',!!state.engineStarting);msg.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF';
}
const Dash={update(p={}){Object.assign(state,p);render()},setVehicle(p={}){Object.assign(state,p);render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return{...state,unit}}};window.Dash=Dash;window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='updateHud')Dash.update(m.data);else if(m.type==='setVehicle')Dash.setVehicle(m.data);else if(m.type==='setUnit')Dash.setUnit(m.data?.unit);else if(m.type==='setVisible')Dash.setVisible(m.visible??m.data?.visible)});
document.querySelectorAll('[data-key]').forEach(i=>i.oninput=()=>{state[i.dataset.key]=Number(i.value);i.nextElementSibling.value=i.value;render()});const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric'];const box=$('demoButtons');toggles.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.classList.toggle('on',state[k]);b.onclick=()=>{state[k]=!state[k];b.classList.toggle('on',state[k]);render()};box.appendChild(b)});const presets={city:{maximumSpeedKmH:180,redlineRPM:6500,maxGear:5,electric:false,motorcycle:false},sport:{maximumSpeedKmH:340,redlineRPM:8500,maxGear:7,electric:false,motorcycle:false},truck:{maximumSpeedKmH:150,redlineRPM:4500,maxGear:12,electric:false,motorcycle:false},moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},ev:{maximumSpeedKmH:260,redlineRPM:18000,maxGear:1,electric:true,motorcycle:false}};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]));$('unitBtn').onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh');if(new URLSearchParams(location.search).has('game'))document.body.classList.add('game');render();
})();
</script>
</body></html>
