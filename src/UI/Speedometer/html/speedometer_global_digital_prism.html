<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT HUD — Global Digital Prism</title><style>
:root{--scale:1;--fg:#effbff;--muted:#8ea2ae;--cyan:#51edff;--vio:#a587ff;--amber:#ffc06a;--red:#ff6573;--green:#89f6a0}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--fg)} body{display:grid;place-items:end center;padding-bottom:18px}
#hud{position:relative;width:1020px;height:235px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 12px 24px rgba(0,0,0,.38))} #hud.hidden{opacity:0;transform:translateY(15px) scale(.96)}
.leftCore{position:absolute;left:0;top:12px;width:320px;height:190px;padding:18px 20px;border-radius:26px 70px 26px 26px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(12,19,25,.74),rgba(5,9,13,.54));backdrop-filter:blur(12px)} .leftCore .mode{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:800}.leftCore .sel{margin-top:6px;font-size:10px;letter-spacing:2px;color:var(--amber);font-weight:800}.leftCore .speed{margin-top:8px;font:900 112px/.82 "Arial Narrow",Inter,sans-serif}.leftCore .unit{font-size:13px;letter-spacing:4px;color:var(--muted);font-weight:800}.leftCore .odo{margin-top:8px;font:700 12px/1 "Roboto Mono",Consolas,monospace;color:#d4e4eb}
.centerCore{position:absolute;left:345px;top:0;width:330px;height:220px;padding:14px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(13,19,25,.68),rgba(5,9,13,.52));backdrop-filter:blur(12px)} .centerCore .gear{font:900 76px/.82 "Arial Narrow",Inter,sans-serif;text-align:center}.rpmGrid{margin-top:8px;height:84px;display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-items:end} .rpmGrid i{display:block;height:18%;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.08)} .rpmGrid i.on{background:linear-gradient(180deg,#95f8ff,var(--cyan));box-shadow:0 0 10px rgba(81,237,255,.33)} .rpmGrid i.warn.on{background:linear-gradient(180deg,#e4c8ff,var(--vio));box-shadow:0 0 10px rgba(165,135,255,.3)} .rpmGrid i.red.on{background:linear-gradient(180deg,#ffadb6,var(--red));box-shadow:0 0 12px rgba(255,101,115,.36)} .rpmInfo{margin-top:10px;text-align:center}.rpmInfo .k{font-size:10px;letter-spacing:3px;color:var(--muted);font-weight:800}.rpmInfo .v{margin-top:7px;font:900 44px/.88 "Arial Narrow",Inter,sans-serif}.rpmInfo .s{margin-top:7px;font-size:11px;color:#d2e2e8}
.rightCol{position:absolute;right:0;top:12px;width:325px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(13,19,24,.72),rgba(8,12,15,.54));backdrop-filter:blur(10px)} .tile .k{font-size:9px;letter-spacing:1.7px;color:var(--muted);font-weight:800}.tile .v{margin-top:6px;font:800 18px/1 "Roboto Mono",Consolas,monospace}.bar{height:7px;background:rgba(255,255,255,.07);border-radius:8px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:inherit}
.bottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:330px 1fr 330px;align-items:end}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.in{padding:11px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03)} .in .h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.track{height:7px;background:rgba(255,255,255,.07);border-radius:8px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:inherit}.lamps{display:flex;justify-content:center;gap:8px}.lamp{min-width:56px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(8,13,16,.45);font-size:10px;letter-spacing:1px;color:#62747d;font-weight:900;text-align:center}.lamp.enabled{color:#92a5ad}.lamp.active{color:#041015;background:rgba(81,237,255,.95);border-color:transparent;box-shadow:0 0 14px rgba(81,237,255,.32)} .lamp.warn.active{background:rgba(255,192,106,.95)} .lamp.danger.active{background:rgba(255,101,115,.95);color:#fff}
.overlay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:26px}.overlay.on{opacity:1}.overlay b{font-size:15px;letter-spacing:5px}.overlay b.starting{color:var(--amber);animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.35}}
.demo-panel{position:fixed;top:10px;right:10px;width:275px;max-height:calc(100vh - 20px);overflow:auto;padding:10px;border-radius:12px;background:rgba(5,8,10,.94);color:#d7e7ee;border:1px solid #2a4048;font:11px Consolas,monospace;z-index:10}.demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px}.demo-panel label{display:grid;grid-template-columns:86px 1fr 42px;gap:6px;align-items:center;margin:4px 0}.demo-panel button{margin:2px;border:1px solid #34505b;background:#0d161b;color:#99b8c4;border-radius:6px;padding:4px 6px;font:10px Consolas;cursor:pointer}.demo-panel button.on{background:var(--cyan);color:#051015;border-color:transparent} body.game .demo-panel{display:none}
@media (max-width:1040px){:root{--scale:.82}} @media (max-width:860px){:root{--scale:.66}}
</style></head><body>
<div id="hud">
 <div class="leftCore"><div class="mode" id="mode">MANUAL</div><div class="sel" id="selector">SPORT</div><div class="speed" id="speed">126</div><div class="unit" id="unit">KM/H</div><div class="odo" id="odo">31,842.6 km</div></div>
 <div class="centerCore"><div class="gear" id="gear">4</div><div class="rpmGrid" id="rpmGrid"></div><div class="rpmInfo"><div class="k" id="rpmLabel">ENGINE RPM</div><div class="v" id="rpmValue">4,620</div><div class="s">REDLINE <b id="redline">7,600</b> · <span id="vehicle">CAR</span></div></div></div>
 <div class="rightCol"><div class="tile"><div class="k">BOOST</div><div class="v"><span id="boost">0.5</span> bar</div><div class="bar"><i id="boostBar"></i></div></div><div class="tile"><div class="k">FUEL</div><div class="v"><span id="fuel">64</span>%</div><div class="bar"><i id="fuelBar"></i></div></div><div class="tile"><div class="k">OIL TEMP</div><div class="v"><span id="oilTemp">94</span>°</div><div class="bar"><i id="oilTempBar"></i></div></div><div class="tile"><div class="k">CLUTCH</div><div class="v"><span id="clutch">28</span>%</div><div class="bar"><i id="clutchBar"></i></div></div><div class="tile"><div class="k">ENGINE</div><div class="v"><span id="engineHealth">92</span>%</div></div><div class="tile"><div class="k">GEARBOX</div><div class="v"><span id="gearboxHealth">87</span>%</div></div></div>
 <div class="bottom"><div class="inputs"><div class="in"><div class="h"><span>THROTTLE</span><b id="thrPct">48%</b></div><div class="track"><i id="thrBar"></i></div></div><div class="in"><div class="h"><span>BRAKE</span><b id="brkPct">6%</b></div><div class="track"><i id="brkBar"></i></div></div></div><div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div><div></div></div>
 <div class="overlay" id="overlay"><b id="overlayText">ENGINE OFF</b></div>
</div>
<div class="demo-panel"><h4>DEMO</h4>
<label>Speed <input data-key="speedKmH" type="range" min="0" max="420" value="126"><output>126</output></label>
<label>RPM <input data-key="physicalRPM" type="range" min="0" max="18000" value="4620"><output>4620</output></label>
<label>Norm RPM <input data-key="normalizedRPM" type="range" min="0" max="1.2" step="0.01" value="0.56"><output>0.56</output></label>
<label>Gear <input data-key="gear" type="range" min="-1" max="12" value="4"><output>4</output></label>
<label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="64"><output>64</output></label>
<label>Oil Temp <input data-key="oilTemperature" type="range" min="0" max="160" value="94"><output>94</output></label>
<label>Oil Life <input data-key="oilLife" type="range" min="0" max="100" value="81"><output>81</output></label>
<label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="28"><output>28</output></label>
<label>Boost <input data-key="boost" type="range" min="-1" max="3" step="0.1" value="0.5"><output>0.5</output></label>
<label>Throttle <input data-key="throttle" type="range" min="0" max="1" step="0.01" value="0.48"><output>0.48</output></label>
<label>Brake <input data-key="brake" type="range" min="0" max="1" step="0.01" value="0.06"><output>0.06</output></label>
<label>Eng Health <input data-key="engineHealth" type="range" min="0" max="100" value="92"><output>92</output></label>
<label>GB Health <input data-key="gearboxHealth" type="range" min="0" max="100" value="87"><output>87</output></label>
<h4>TOGGLES</h4><div id="demoButtons"></div>
<h4>PRESET</h4><button data-preset="city">CITY</button><button data-preset="sport">SPORT</button><button data-preset="truck">TRUCK</button><button data-preset="moto">MOTO</button><button data-preset="ev">EV</button><button id="unitBtn">KM/H ↔ MPH</button></div><script>(()=>{'use strict';
const K=.621371,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));
const state={speedKmH:126,normalizedRPM:.56,physicalRPM:4620,redlineRPM:7600,fuel:64,oilTemperature:94,oilLife:81,engineHealth:92,gearboxHealth:87,clutchHeat:28,boost:.5,odometerKm:31842.6,throttle:.48,brake:.06,maximumSpeedKmH:320,gear:4,maxGear:7,transmissionMode:0,automaticSelector:null,motorcycle:false,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:1,modelHash:0x1A2B3C4D};
let unit='kmh';
function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}
function speedValue(){return state.speedKmH*(unit==='mph'?K:1)}
function odoValue(){return state.odometerKm*(unit==='mph'?K:1)}
function modeLabel(){return ['MANUAL','AUTO','SEQUENTIAL'][state.transmissionMode]||`MODE ${state.transmissionMode}`}
function vehicleLabel(){if(state.electric) return state.motorcycle?'E-MOTO':'EV'; return state.motorcycle?'MOTO':'CAR';}
function lamp(id,en,on){const e=$(id); if(!e) return; e.classList.toggle('enabled',!!en); e.classList.toggle('active',!!on)}
function setText(id,val){const e=$(id); if(e) e.textContent=val}
function setWidth(id,p){const e=$(id); if(e) e.style.width=clamp(p,0,100)+'%'}
function setHeight(id,p){const e=$(id); if(e) e.style.height=clamp(p,0,100)+'%'}
function setRotate(id,deg){const e=$(id); if(e) e.style.transform=`rotate(${deg}deg)`}
const Dash={update(p={}){Object.assign(state,p);render()},setVehicle(p={}){Object.assign(state,p);render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return {...state,unit}}};
window.Dash=Dash;
window.addEventListener('message',e=>{const m=e.data||{}; if(m.type==='updateHud') Dash.update(m.data||{}); else if(m.type==='setVehicle') Dash.setVehicle(m.data||{}); else if(m.type==='setUnit') Dash.setUnit(m.data?.unit); else if(m.type==='setVisible') Dash.setVisible(m.visible ?? m.data?.visible);});
function initDemo(){document.querySelectorAll('[data-key]').forEach(i=>{const out=i.nextElementSibling; if(out&&out.tagName==='OUTPUT') out.value=i.value; i.addEventListener('input',()=>{state[i.dataset.key]=Number(i.value); if(out&&out.tagName==='OUTPUT') out.value=i.value; render();});}); const box=$('demoButtons'); if(box){const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric']; toggles.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.classList.toggle('on',!!state[k]); b.onclick=()=>{state[k]=!state[k]; b.classList.toggle('on',!!state[k]); render();}; box.appendChild(b);});}
 const presets={city:{maximumSpeedKmH:180,redlineRPM:6500,maxGear:5,electric:false,motorcycle:false},sport:{maximumSpeedKmH:340,redlineRPM:8500,maxGear:7,electric:false,motorcycle:false},truck:{maximumSpeedKmH:150,redlineRPM:4200,maxGear:12,electric:false,motorcycle:false},moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},ev:{maximumSpeedKmH:250,redlineRPM:18000,maxGear:1,electric:true,motorcycle:false}};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]||{})); const ub=$('unitBtn'); if(ub) ub.onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh'); if(new URLSearchParams(location.search).has('game')) document.body.classList.add('game'); render();}

for(let i=0;i<24;i++){const s=document.createElement('i'); s.style.height=(22 + i*3)+'%'; $('rpmGrid').appendChild(s)}
function render(){const rpmNorm=state.electric?clamp(state.normalizedRPM,0,1.15):clamp((state.physicalRPM||0)/(state.redlineRPM||1),0,1.15),active=Math.round(clamp(rpmNorm,0,1)*24); document.querySelectorAll('#rpmGrid i').forEach((s,i)=>{s.className=''; if(i<active) s.classList.add('on'); if(i>=16) s.classList.add('warn'); if(i>=21) s.classList.add('red')}); setText('mode',modeLabel()); setText('selector',state.automaticSelector || (state.launchControl?'LAUNCH':state.transmissionMode===1?'AUTO':'PRISM')); setText('speed',String(Math.round(speedValue())).padStart(3,'0')); setText('unit',unit==='mph'?'MPH':'KM/H'); setText('odo',`${odoValue().toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`); setText('gear',gearLabel()); setText('rpmLabel',state.electric?'POWER OUTPUT':'ENGINE RPM'); setText('rpmValue',state.electric?Math.round(clamp(state.normalizedRPM,0,1)*100)+'%':Math.round(state.physicalRPM||0).toLocaleString()); setText('redline',state.electric?'100%':Math.round(state.redlineRPM||0).toLocaleString()); setText('vehicle',vehicleLabel());
 setText('boost',Number(state.boost||0).toFixed(1)); setWidth('boostBar',clamp((Number(state.boost||0)+1)/4*100,0,100)); $('boostBar').style.background='linear-gradient(90deg,#69dbff,var(--cyan))'; setText('fuel',toPct(state.fuel)); setWidth('fuelBar',toPct(state.fuel)); $('fuelBar').style.background='linear-gradient(90deg,#69dbff,var(--cyan))'; const temp=Math.round(state.oilTemperature||0); setText('oilTemp',temp); setWidth('oilTempBar',clamp(temp/150*100,0,100)); $('oilTempBar').style.background=temp>125?'linear-gradient(90deg,#ff9772,var(--red))':temp>110?'linear-gradient(90deg,#ffd88a,var(--amber))':'linear-gradient(90deg,#69dbff,var(--cyan))'; const clutch=toPct(state.clutchHeat); setText('clutch',clutch); setWidth('clutchBar',clutch); $('clutchBar').style.background=clutch>75?'linear-gradient(90deg,#ff9772,var(--red))':clutch>50?'linear-gradient(90deg,#ffd88a,var(--amber))':'linear-gradient(90deg,#8af6a2,var(--green))'; setText('engineHealth',toPct(state.engineHealth)); setText('gearboxHealth',toPct(state.gearboxHealth)); const thr=toPct(state.throttle), brk=toPct(state.brake); setText('thrPct',thr+'%'); setWidth('thrBar',thr); $('thrBar').style.background='linear-gradient(90deg,#69dbff,var(--cyan))'; setText('brkPct',brk+'%'); setWidth('brkBar',brk); $('brkBar').style.background='linear-gradient(90deg,#ff9772,var(--red))'; lamp('lABS',state.absEnabled,state.absActive); lamp('lTCS',state.tcsEnabled,state.tcsActive); lamp('lESC',state.escEnabled,state.escActive); lamp('lPB',true,state.parkingBrake); lamp('lLC',state.launchEnabled,state.launchControl); lamp('lBurn',true,state.burnout); lamp('lRoll',true,state.rollWarning); const ov=$('overlay'), txt=$('overlayText'); ov.classList.toggle('on',!state.engineOn||state.engineStarting); txt.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF'; txt.classList.toggle('starting',state.engineStarting);} initDemo();
})();</script></body></html>
