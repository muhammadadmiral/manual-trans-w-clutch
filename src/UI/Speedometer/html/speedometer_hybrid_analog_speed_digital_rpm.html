<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT HUD — Hybrid Analog Speed + Digital RPM</title>
<style>
:root{--scale:1;--bg:#070a0d;--panel:#0d151a;--line:#293a43;--text:#eff6f8;--muted:#72858e;--cyan:#35dcff;--green:#5ce395;--amber:#ffb53e;--red:#ff4854}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}body{display:grid;place-items:end center;padding-bottom:20px}#hud{position:relative;width:1040px;height:430px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}#hud.hidden{opacity:0;transform:scale(calc(var(--scale)*.96)) translateY(18px)}.shell{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,30,.97),rgba(5,9,11,.96));border:1px solid rgba(53,220,255,.14);clip-path:polygon(4% 8%,55% 0,96% 4%,100% 86%,93% 100%,6% 100%,0 88%);box-shadow:inset 0 1px rgba(255,255,255,.05),inset 0 -80px 100px rgba(0,0,0,.3)}
.digital{position:absolute;left:34px;top:38px;width:572px;height:350px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(180deg,rgba(16,29,36,.95),rgba(7,12,15,.97));overflow:hidden}.top{height:37px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20313a;font-size:9px;font-weight:900;letter-spacing:1.4px;color:var(--muted)}.top b{color:var(--cyan)}.rpm-main{height:148px;display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid #1e2e36}.gear{text-align:center;padding-top:19px;border-right:1px solid #20313a}.gear label,.rpm-zone label{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:1.4px}#gear{font:950 88px/.84 "Arial Narrow",Inter;color:var(--cyan);text-shadow:0 0 20px rgba(53,220,255,.35)}#selector{height:12px;margin-top:6px;color:var(--amber);font-size:9px;font-weight:900;letter-spacing:2px}.rpm-zone{padding:18px 18px 0}.rpm-head{display:flex;justify-content:space-between;align-items:flex-end}.rpm-number{font:900 50px/.9 Consolas;color:var(--text)}.rpm-number small{font:700 9px Inter;color:var(--muted);letter-spacing:1px}.redline{font:700 10px Consolas;color:var(--red)}.rpm-bars{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:18px;height:27px;transform:skewX(-8deg)}.rpm-bars i{background:#17262e;transition:.04s}.rpm-bars i.on{background:var(--cyan);box-shadow:0 0 6px rgba(53,220,255,.42)}.rpm-bars i.warn.on{background:var(--amber)}.rpm-bars i.red.on{background:var(--red)}
.metrics{height:76px;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #1e2e36}.metric{padding:10px;border-right:1px solid #1d2c34}.metric:last-child{border-right:0}.metric label{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:1px}.metric b{display:block;margin-top:7px;font:800 16px Consolas}.metric b small{font-size:8px;color:var(--muted)}.bar{height:4px;background:#17262e;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green)}
.low{height:89px;padding:10px 13px}.pedals{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phead{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);font-weight:900;letter-spacing:1px}.ptrack{height:7px;background:#17262e;border-radius:4px;margin-top:4px;overflow:hidden}.ptrack i{display:block;height:100%;width:0}.ptrack .thr{background:var(--cyan)}.ptrack .brk{background:var(--red)}.status{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.lamps{display:flex;gap:5px}.lamp{height:22px;min-width:39px;padding:0 7px;border:1px solid #2a3b44;border-radius:5px;background:#091116;color:#43555e;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900}.lamp.enabled{color:#809199}.lamp.active{background:var(--cyan);border-color:var(--cyan);color:#061015}.lamp.warn.active{background:var(--amber);border-color:var(--amber)}.lamp.danger.active{background:var(--red);border-color:var(--red);color:#fff}.meta{font:700 8px Consolas;color:#52656e}.meta b{color:#a9bac1}
.dial{position:absolute;right:34px;top:30px;width:376px;height:376px;border-radius:50%;background:radial-gradient(circle at 50% 47%,#172126 0 50%,#0a0e11 51% 61%,#29363c 62% 63%,#080b0d 64% 69%,#415158 70% 71%,#090d0f 72%);box-shadow:0 0 0 1px #050708,inset 0 0 0 1px rgba(255,255,255,.04)}.dial svg{width:100%;height:100%}.tick-major{stroke:#dce5e8;stroke-width:2.6;stroke-linecap:round}.tick-minor{stroke:#58676e;stroke-width:1.1}.tick-label{fill:#d2dcdf;font-size:15px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.needle{fill:#f3f7f8;filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}.hub{fill:#11181c;stroke:#74858c;stroke-width:2}.dial-caption{position:absolute;left:0;right:0;top:240px;text-align:center;font-size:11px;font-weight:900;letter-spacing:3px;color:var(--muted)}.dial-speed{position:absolute;left:0;right:0;top:271px;text-align:center;font:850 29px Consolas}.dial-speed small{font:700 9px Inter;color:var(--muted)}.boost-chip{position:absolute;right:132px;top:324px;font:800 11px Consolas;color:var(--cyan);background:#0b1419;border:1px solid #263840;border-radius:6px;padding:5px 8px}.engine-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.2s}.engine-overlay.on{opacity:1}.engine-message{font-size:14px;font-weight:900;letter-spacing:7px;color:#71848c}.engine-message.starting{color:var(--amber);animation:pulse .55s infinite alternate}@keyframes pulse{to{opacity:.3}}
.demo-panel{position:fixed;top:10px;right:10px;width:270px;max-height:calc(100vh - 20px);overflow:auto;padding:10px 12px;border:1px solid #31434c;border-radius:12px;background:rgba(7,11,14,.95);color:#dce7eb;font:11px/1.35 Consolas;z-index:5}.demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px}.demo-panel label{display:grid;grid-template-columns:92px 1fr 42px;gap:5px;align-items:center;margin:4px 0}.demo-panel input{width:100%}.demo-panel button{border:1px solid #344852;background:#10191e;color:#9aacb3;border-radius:5px;padding:4px 7px;margin:2px;cursor:pointer;font:10px Consolas}.demo-panel button.on{background:var(--cyan);color:#061015;border-color:var(--cyan)}body.game .demo-panel{display:none}@media(max-width:1100px){:root{--scale:.82}}@media(max-width:850px){:root{--scale:.64}}
</style></head><body>
<div id="hud"><div class="shell"></div><section class="digital"><div class="top"><span>HYBRID PERFORMANCE CLUSTER</span><b id="mode">MANUAL</b><span id="vehicle">CAR</span></div><div class="rpm-main"><div class="gear"><label>GEAR</label><div id="gear">4</div><div id="selector"></div></div><div class="rpm-zone"><div class="rpm-head"><div><label id="rpmLabel">ENGINE RPM</label><div class="rpm-number"><span id="rpmValue">4,200</span> <small id="rpmUnit">RPM</small></div></div><div class="redline">REDLINE <span id="redline">7000</span></div></div><div class="rpm-bars" id="rpmBars"></div></div></div><div class="metrics"><div class="metric"><label>FUEL</label><b><span id="fuel">68</span><small>%</small></b><div class="bar"><i id="fuelBar"></i></div></div><div class="metric"><label>OIL TEMP</label><b><span id="oilTemp">96</span><small>°C</small></b><div class="bar"><i id="oilTempBar"></i></div></div><div class="metric"><label>OIL LIFE</label><b><span id="oilLife">82</span><small>%</small></b><div class="bar"><i id="oilLifeBar"></i></div></div><div class="metric"><label>CLUTCH</label><b><span id="clutch">32</span><small>%</small></b><div class="bar"><i id="clutchBar"></i></div></div></div><div class="low"><div class="pedals"><div><div class="phead"><span>THROTTLE</span><b id="thrPct">46%</b></div><div class="ptrack"><i class="thr" id="thrBar"></i></div></div><div><div class="phead"><span>BRAKE</span><b id="brkPct">0%</b></div><div class="ptrack"><i class="brk" id="brkBar"></i></div></div></div><div class="status"><div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div><div class="meta">ENG <b id="eng">93</b> · BOX <b id="box">89</b> · G<b id="metaGear">6</b> · C<b id="vclass">0</b> · <b id="hash">1234ABCD</b></div></div></div><div class="engine-overlay" id="engineOverlay"><div class="engine-message" id="engineMessage">ENGINE OFF</div></div></section>
<section class="dial"><svg viewBox="0 0 376 376"><g transform="translate(188 188)"><g id="ticks"></g><g id="needle"><path class="needle" d="M-4 18 L0 -142 L4 18 Z"/><circle class="hub" r="17"/><circle fill="#eef4f6" r="5"/></g></g></svg><div class="dial-caption" id="speedLabel">KM/H</div><div class="dial-speed"><span id="speed">96</span> <small id="unit">KM/H</small><div id="odo" style="font:700 9px Consolas;color:var(--muted);margin-top:8px">ODO 12,843.7 km</div></div><div class="boost-chip">BOOST <span id="boost">0.8</span> BAR</div></section></div>
<div class="demo-panel"><h4>ANALOG SPEED + DIGITAL RPM</h4><label>Speed <input data-key="speedKmH" type="range" min="0" max="420" value="96"><output>96</output></label><label>RPM <input data-key="physicalRPM" type="range" min="0" max="16000" value="4200"><output>4200</output></label><label>Gear <input data-key="gear" type="range" min="-1" max="8" value="4"><output>4</output></label><label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="68"><output>68</output></label><label>Oil temp <input data-key="oilTemperature" type="range" min="0" max="160" value="96"><output>96</output></label><label>Oil life <input data-key="oilLife" type="range" min="0" max="100" value="82"><output>82</output></label><label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="32"><output>32</output></label><label>Boost <input data-key="boost" type="range" step=".1" min="-1" max="3" value=".8"><output>.8</output></label><label>Throttle <input data-key="throttle" type="range" step=".01" min="0" max="1" value=".46"><output>.46</output></label><label>Brake <input data-key="brake" type="range" step=".01" min="0" max="1" value="0"><output>0</output></label><label>Engine <input data-key="engineHealth" type="range" min="0" max="100" value="93"><output>93</output></label><label>Gearbox <input data-key="gearboxHealth" type="range" min="0" max="100" value="89"><output>89</output></label><h4>STATE</h4><div id="demoButtons"></div><h4>PRESET</h4><button data-preset="city">CITY</button><button data-preset="sport">SPORT</button><button data-preset="truck">TRUCK</button><button data-preset="moto">MOTO</button><button data-preset="ev">EV</button><button id="unitBtn">KM/H ↔ MPH</button></div>
<script>
(()=>{'use strict';const K=.621371,START=-132,END=132,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));const state={speedKmH:96,normalizedRPM:.6,physicalRPM:4200,redlineRPM:7000,fuel:68,oilTemperature:96,oilLife:82,engineHealth:93,gearboxHealth:89,clutchHeat:32,boost:.8,odometerKm:12843.7,throttle:.46,brake:0,maximumSpeedKmH:320,gear:4,maxGear:6,transmissionMode:0,automaticSelector:null,motorcycle:false,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:0,modelHash:0x1234ABCD};let unit='kmh',speedTop=320;for(let i=0;i<24;i++){const s=document.createElement('i');$('rpmBars').appendChild(s)}const polar=(r,a)=>{const q=(a-90)*Math.PI/180;return{x:r*Math.cos(q),y:r*Math.sin(q)}};function nice(max){const rough=max/8,mag=10**Math.floor(Math.log10(rough||1)),n=rough/mag;return(n<1.5?1:n<3?2:n<7?5:10)*mag}function rebuild(){const max=state.maximumSpeedKmH*(unit==='mph'?K:1),step=nice(max);speedTop=Math.ceil(max/step)*step;let h='';for(let v=0;v<=speedTop+.01;v+=step/5){const major=Math.abs(v/step-Math.round(v/step))<.001,a=START+v/speedTop*(END-START),p1=polar(major?141:151,a),p2=polar(162,a);h+=`<line class="${major?'tick-major':'tick-minor'}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;if(major){const p=polar(118,a);h+=`<text class="tick-label" x="${p.x}" y="${p.y}">${Math.round(v)}</text>`}}$('ticks').innerHTML=h;$('speedLabel').textContent=unit==='mph'?'MPH':'KM/H'}function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}function lamp(id,en,on){const e=$(id);e.classList.toggle('enabled',!!en);e.classList.toggle('active',!!on)}function bar(id,v,c){const e=$(id);e.style.width=clamp(v,0,100)+'%';e.style.background=c||(v<30?'var(--red)':v<60?'var(--amber)':'var(--green)')}function render(){const sp=state.speedKmH*(unit==='mph'?K:1);$('needle').setAttribute('transform',`rotate(${START+clamp(sp,0,speedTop)/speedTop*(END-START)})`);$('speed').textContent=Math.round(sp);$('unit').textContent=unit==='mph'?'MPH':'KM/H';$('odo').textContent=`ODO ${(state.odometerKm*(unit==='mph'?K:1)).toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`;const rpmNorm=state.electric?clamp(state.normalizedRPM,0,1.2):clamp((state.physicalRPM||0)/(state.redlineRPM||1),0,1.2),active=Math.round(clamp(rpmNorm,0,1)*24);document.querySelectorAll('#rpmBars i').forEach((s,i)=>{s.className='';if(i<active)s.classList.add('on');if(i>=18)s.classList.add('warn');if(i>=22)s.classList.add('red')});$('rpmLabel').textContent=state.electric?'POWER OUTPUT':'ENGINE RPM';$('rpmValue').textContent=state.electric?Math.round(rpmNorm*100)+'%':Math.round(state.physicalRPM||0).toLocaleString();$('rpmUnit').textContent=state.electric?'':'RPM';$('redline').textContent=state.electric?'100%':Math.round(state.redlineRPM||0);$('gear').textContent=gearLabel();$('selector').textContent=state.automaticSelector||'';$('mode').textContent=['MANUAL','AUTO','SEQUENTIAL'][state.transmissionMode]||`MODE ${state.transmissionMode}`;$('vehicle').textContent=state.electric?(state.motorcycle?'E-MOTO':'EV'):state.motorcycle?'MOTO':'CAR';$('boost').textContent=Number(state.boost||0).toFixed(1);const fuel=toPct(state.fuel),oil=toPct(state.oilLife),cl=toPct(state.clutchHeat),thr=toPct(state.throttle),brk=toPct(state.brake);$('fuel').textContent=fuel;$('oilTemp').textContent=Math.round(state.oilTemperature||0);$('oilLife').textContent=oil;$('clutch').textContent=cl;bar('fuelBar',fuel);bar('oilLifeBar',oil);bar('clutchBar',cl,cl>75?'var(--red)':cl>50?'var(--amber)':'var(--green)');bar('oilTempBar',clamp((state.oilTemperature||0)/150*100,0,100),(state.oilTemperature||0)>125?'var(--red)':(state.oilTemperature||0)>110?'var(--amber)':'var(--green)');$('thrPct').textContent=thr+'%';$('brkPct').textContent=brk+'%';$('thrBar').style.width=thr+'%';$('brkBar').style.width=brk+'%';$('eng').textContent=toPct(state.engineHealth);$('box').textContent=toPct(state.gearboxHealth);$('metaGear').textContent=state.maxGear||'—';$('vclass').textContent=state.vehicleClass;$('hash').textContent=(Number(state.modelHash)>>>0).toString(16).padStart(8,'0').toUpperCase();lamp('lABS',state.absEnabled,state.absActive);lamp('lTCS',state.tcsEnabled,state.tcsActive);lamp('lESC',state.escEnabled,state.escActive);lamp('lPB',true,state.parkingBrake);lamp('lLC',state.launchEnabled,state.launchControl);lamp('lBurn',true,state.burnout);lamp('lRoll',true,state.rollWarning);const ov=$('engineOverlay'),msg=$('engineMessage');ov.classList.toggle('on',!state.engineOn||state.engineStarting);msg.classList.toggle('starting',!!state.engineStarting);msg.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF'}const Dash={update(p={}){const r=['maximumSpeedKmH'].some(k=>k in p);Object.assign(state,p);if(r)rebuild();render()},setVehicle(p={}){Object.assign(state,p);rebuild();render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';rebuild();render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return{...state,unit}}};window.Dash=Dash;window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='updateHud')Dash.update(m.data);else if(m.type==='setVehicle')Dash.setVehicle(m.data);else if(m.type==='setUnit')Dash.setUnit(m.data?.unit);else if(m.type==='setVisible')Dash.setVisible(m.visible??m.data?.visible)});document.querySelectorAll('[data-key]').forEach(i=>i.oninput=()=>{state[i.dataset.key]=Number(i.value);i.nextElementSibling.value=i.value;render()});const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric'];const box=$('demoButtons');toggles.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.classList.toggle('on',state[k]);b.onclick=()=>{state[k]=!state[k];b.classList.toggle('on',state[k]);render()};box.appendChild(b)});const presets={city:{maximumSpeedKmH:180,redlineRPM:6500,maxGear:5,electric:false,motorcycle:false},sport:{maximumSpeedKmH:340,redlineRPM:8500,maxGear:7,electric:false,motorcycle:false},truck:{maximumSpeedKmH:150,redlineRPM:4500,maxGear:12,electric:false,motorcycle:false},moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},ev:{maximumSpeedKmH:260,redlineRPM:18000,maxGear:1,electric:true,motorcycle:false}};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]));$('unitBtn').onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh');if(new URLSearchParams(location.search).has('game'))document.body.classList.add('game');rebuild();render()})();
</script></body></html>
