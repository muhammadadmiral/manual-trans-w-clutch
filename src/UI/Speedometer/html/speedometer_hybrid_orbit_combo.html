
<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT HUD — Hybrid Orbit Combo</title>
<style>
:root{--scale:1;--fg:#f0f8fc;--muted:#8198a4;--cyan:#4beaff;--amber:#ffbe54;--red:#ff586e;--green:#86f79e;--ice:#b8eeff;}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--fg)} body{display:grid;place-items:end center;padding-bottom:18px} #hud{position:relative;width:980px;height:290px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 10px 26px rgba(0,0,0,.42))} #hud.hidden{opacity:0;transform:translateY(18px) scale(.96)}
.glass{border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(11,18,24,.72),rgba(6,10,14,.54));backdrop-filter:blur(11px);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.leftDial{position:absolute;left:0;top:16px;width:330px;height:220px} .leftDial svg{width:100%;height:100%;overflow:visible} .dial-box{position:absolute;inset:0} .speedCard{position:absolute;left:46px;top:76px;width:150px;text-align:center} .speedCard .num{font:900 72px/.85 "Arial Narrow",Inter,sans-serif} .speedCard .unit{font-size:12px;letter-spacing:4px;color:var(--muted);font-weight:800} .speedCard .odo{margin-top:8px;font:700 11px/1 "Roboto Mono",Consolas,monospace;color:#d4e4eb} .dialLabel{position:absolute;left:24px;top:22px;font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:800}
.center{position:absolute;left:300px;right:300px;top:12px;height:230px;padding:14px 16px;border-radius:26px} .metaTop{display:flex;justify-content:space-between;align-items:flex-start} .gear{font:900 82px/.82 "Arial Narrow",Inter,sans-serif;color:var(--ice);text-shadow:0 0 14px rgba(75,234,255,.16)} .mode{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:800} .selector{margin-top:8px;font-size:10px;letter-spacing:2px;color:var(--amber);font-weight:800} .rpmBox{margin-top:8px} .rpmHead{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800} .rpmLadder{margin-top:8px;height:116px;display:grid;grid-template-columns:repeat(24,1fr);align-items:end;gap:5px} .rpmLadder i{display:block;height:12%;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.08)} .rpmLadder i.on{background:linear-gradient(180deg,#79efff,var(--cyan));box-shadow:0 0 9px rgba(75,234,255,.28)} .rpmLadder i.warn.on{background:linear-gradient(180deg,#ffdf9a,var(--amber));box-shadow:0 0 9px rgba(255,190,84,.28)} .rpmLadder i.red.on{background:linear-gradient(180deg,#ff9ea9,var(--red));box-shadow:0 0 10px rgba(255,88,110,.32)} .rpmValue{margin-top:10px;font:800 34px/1 "Roboto Mono",Consolas,monospace;text-align:center}
.rightCol{position:absolute;right:0;top:10px;width:280px;display:grid;gap:12px} .tile{border-radius:22px;padding:14px 16px} .tile .k{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800} .tile .v{margin-top:6px;font:800 24px/1 "Roboto Mono",Consolas,monospace} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .bar{height:8px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;width:0;border-radius:inherit}
.bottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 420px 1fr;align-items:end} .inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px} .input{border-radius:16px;padding:10px 14px} .input .h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800} .input .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.06);margin-top:8px;overflow:hidden} .input .tr i{display:block;height:100%;width:0;border-radius:inherit} .lamps{display:flex;justify-content:center;gap:8px} .lamp{min-width:54px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:rgba(8,13,16,.52);backdrop-filter:blur(7px);font-size:10px;letter-spacing:1px;color:#5f747e;font-weight:900;text-align:center} .lamp.enabled{color:#90a7af} .lamp.active{color:#041015;background:rgba(75,234,255,.94);border-color:transparent;box-shadow:0 0 13px rgba(75,234,255,.34)} .lamp.warn.active{background:rgba(255,190,84,.95)} .lamp.danger.active{background:rgba(255,88,110,.95);color:white}
.overlay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:32px} .overlay.on{opacity:1} .overlay b{font-size:15px;letter-spacing:5px} .overlay b.starting{color:var(--amber);animation:pulse .7s infinite alternate} @keyframes pulse{to{opacity:.32}}
.demo-panel{position:fixed;top:10px;right:10px;width:275px;max-height:calc(100vh - 20px);overflow:auto;padding:10px;border-radius:12px;background:rgba(5,8,10,.94);color:#d7e7ee;border:1px solid #2a4048;font:11px Consolas,monospace;z-index:10} .demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px} .demo-panel label{display:grid;grid-template-columns:86px 1fr 42px;gap:6px;align-items:center;margin:4px 0} .demo-panel button{margin:2px;border:1px solid #34505b;background:#0d161b;color:#99b8c4;border-radius:6px;padding:4px 6px;font:10px Consolas;cursor:pointer} .demo-panel button.on{background:var(--cyan);color:#051015;border-color:transparent} body.game .demo-panel{display:none}
@media (max-width:1040px){:root{--scale:.84}} @media (max-width:860px){:root{--scale:.68}}
</style></head><body>
<div id="hud">
  <div class="leftDial"><div class="dialLabel">ANALOG SPEED</div><svg viewBox="0 0 330 220"><path d="M38,184 A128,128 0 0 1 292,184" stroke="rgba(255,255,255,.08)" stroke-width="16" fill="none" stroke-linecap="round"/><path id="speedArc" d="M38,184 A128,128 0 0 1 292,184" stroke="url(#sg)" stroke-width="16" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4beaff"/><stop offset=".7" stop-color="#86f79e"/><stop offset="1" stop-color="#ffbe54"/></linearGradient></defs><g id="speedNeedleGroup" style="transform-origin:165px 184px"><line x1="165" y1="184" x2="260" y2="104" stroke="#eaf8ff" stroke-width="4" stroke-linecap="round"/><circle cx="165" cy="184" r="9" fill="#edf8ff" stroke="#102028" stroke-width="4"/></g></svg><div class="speedCard"><div class="num" id="speed">118</div><div class="unit" id="unit">KM/H</div><div class="odo" id="odo">18,426.3 km</div></div></div>
  <div class="glass center">
    <div class="metaTop"><div><div class="mode" id="mode">MANUAL</div><div class="selector" id="selector">SPORT</div></div><div class="gear" id="gear">3</div></div>
    <div class="rpmBox"><div class="rpmHead"><span id="rpmLabel">DIGITAL RPM</span><span><b id="rpmValue">7,420</b> / <b id="redline">14,000</b></span></div><div class="rpmLadder" id="rpmLadder"></div><div class="rpmValue" id="vehicle">MOTO</div></div>
  </div>
  <div class="rightCol">
    <div class="grid2"><div class="glass tile"><div class="k">BOOST</div><div class="v"><span id="boost">0.6</span> bar</div><div class="bar"><i id="boostBar"></i></div></div><div class="glass tile"><div class="k">FUEL</div><div class="v"><span id="fuel">61</span>%</div><div class="bar"><i id="fuelBar"></i></div></div></div>
    <div class="grid2"><div class="glass tile"><div class="k">OIL TEMP</div><div class="v"><span id="oilTemp">95</span>°C</div><div class="bar"><i id="oilTempBar"></i></div></div><div class="glass tile"><div class="k">CLUTCH</div><div class="v"><span id="clutch">34</span>%</div><div class="bar"><i id="clutchBar"></i></div></div></div>
    <div class="grid2"><div class="glass tile"><div class="k">ENGINE</div><div class="v"><span id="engineHealth">91</span>%</div></div><div class="glass tile"><div class="k">GEARBOX</div><div class="v"><span id="gearboxHealth">88</span>%</div></div></div>
  </div>
  <div class="bottom"><div class="inputs"><div class="glass input"><div class="h"><span>THROTTLE</span><b id="thrPct">52%</b></div><div class="tr"><i id="thrBar"></i></div></div><div class="glass input"><div class="h"><span>BRAKE</span><b id="brkPct">4%</b></div><div class="tr"><i id="brkBar"></i></div></div></div><div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div><div></div></div>
  <div class="overlay" id="overlay"><b id="overlayText">ENGINE OFF</b></div>
</div>
<div class="demo-panel"><h4>DEMO</h4>
<label>Speed <input data-key="speedKmH" type="range" min="0" max="360" value="118"><output>118</output></label>
<label>RPM <input data-key="physicalRPM" type="range" min="0" max="18000" value="7420"><output>7420</output></label>
<label>Norm RPM <input data-key="normalizedRPM" type="range" min="0" max="1.2" step="0.01" value="0.58"><output>0.58</output></label>
<label>Gear <input data-key="gear" type="range" min="-1" max="8" value="3"><output>3</output></label>
<label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="61"><output>61</output></label>
<label>Oil Temp <input data-key="oilTemperature" type="range" min="0" max="160" value="95"><output>95</output></label>
<label>Oil Life <input data-key="oilLife" type="range" min="0" max="100" value="82"><output>82</output></label>
<label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="34"><output>34</output></label>
<label>Boost <input data-key="boost" type="range" min="-1" max="3" step="0.1" value="0.6"><output>0.6</output></label>
<label>Throttle <input data-key="throttle" type="range" min="0" max="1" step="0.01" value="0.52"><output>0.52</output></label>
<label>Brake <input data-key="brake" type="range" min="0" max="1" step="0.01" value="0.04"><output>0.04</output></label>
<label>Eng Health <input data-key="engineHealth" type="range" min="0" max="100" value="91"><output>91</output></label>
<label>GB Health <input data-key="gearboxHealth" type="range" min="0" max="100" value="88"><output>88</output></label>
<h4>TOGGLES</h4><div id="demoButtons"></div>
<h4>PRESET</h4><button data-preset="moto">MOTO</button><button data-preset="superbike">SUPERBIKE</button><button data-preset="touring">TOURING</button><button data-preset="scooter">SCOOTER</button><button data-preset="ev">E-MOTO</button><button id="unitBtn">KM/H ↔ MPH</button></div>
<script>
(()=>{'use strict';

const K=.621371,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));
const state={speedKmH:118,normalizedRPM:.58,physicalRPM:7420,redlineRPM:14000,fuel:61,oilTemperature:95,oilLife:82,engineHealth:91,gearboxHealth:88,clutchHeat:34,boost:.6,odometerKm:18426.3,throttle:.52,brake:.04,maximumSpeedKmH:299,gear:3,maxGear:6,transmissionMode:0,automaticSelector:null,motorcycle:true,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:8,modelHash:0x6F5B6A5C};
let unit='kmh';
function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}
function speedValue(){return state.speedKmH*(unit==='mph'?K:1)}
function odoValue(){return state.odometerKm*(unit==='mph'?K:1)}
function modeLabel(){return ['MANUAL','AUTO','SEQ'][state.transmissionMode]||`MODE ${state.transmissionMode}`}
function vehicleLabel(){if(state.electric) return state.motorcycle?'E-MOTO':'EV'; return state.motorcycle?'MOTO':'CAR';}
function rangePct(v,max){return clamp((Number(v)||0)/(Number(max)||1),0,1)}
function lamp(id,en,on){const e=$(id); if(!e) return; e.classList.toggle('enabled',!!en); e.classList.toggle('active',!!on)}
function setText(id,val){const e=$(id); if(e) e.textContent=val}
function setWidth(id,p){const e=$(id); if(e) e.style.width=clamp(p,0,100)+'%'}
function setHeight(id,p){const e=$(id); if(e) e.style.height=clamp(p,0,100)+'%'}
function setRotate(id,deg){const e=$(id); if(e) e.style.transform=`rotate(${deg}deg)`}
function setVar(name,val){document.documentElement.style.setProperty(name,val)}
const Dash={update(p={}){Object.assign(state,p);render()},setVehicle(p={}){Object.assign(state,p);render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return{...state,unit}}};
window.Dash=Dash; window.addEventListener('message',e=>{const m=e.data||{}; if(m.type==='updateHud') Dash.update(m.data||{}); else if(m.type==='setVehicle') Dash.setVehicle(m.data||{}); else if(m.type==='setUnit') Dash.setUnit(m.data?.unit); else if(m.type==='setVisible') Dash.setVisible(m.visible ?? m.data?.visible);});
function initDemo(){document.querySelectorAll('[data-key]').forEach(i=>{const out=i.nextElementSibling; if(out&&out.tagName==='OUTPUT') out.value=i.value; i.addEventListener('input',()=>{state[i.dataset.key]=Number(i.value); if(out&&out.tagName==='OUTPUT') out.value=i.value; render();});}); const box=$('demoButtons'); if(box){const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric']; toggles.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.classList.toggle('on',!!state[k]); b.onclick=()=>{state[k]=!state[k]; b.classList.toggle('on',!!state[k]); render();}; box.appendChild(b);});}
 const presets={moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},superbike:{maximumSpeedKmH:340,redlineRPM:16200,maxGear:6,electric:false,motorcycle:true},touring:{maximumSpeedKmH:240,redlineRPM:10800,maxGear:6,electric:false,motorcycle:true},scooter:{maximumSpeedKmH:140,redlineRPM:9500,maxGear:1,electric:false,motorcycle:true,transmissionMode:1,automaticSelector:'D'},ev:{maximumSpeedKmH:220,redlineRPM:18000,maxGear:1,electric:true,motorcycle:true}};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]||{})); const ub=$('unitBtn'); if(ub) ub.onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh'); if(new URLSearchParams(location.search).has('game')) document.body.classList.add('game'); render();}

for(let i=0;i<24;i++){const s=document.createElement('i'); s.style.height=(20 + i*3)+'%'; $('rpmLadder').appendChild(s)}
function render(){
  const sp=speedValue(), spNorm=clamp(sp/Math.max(1,state.maximumSpeedKmH*(unit==='mph'?K:1)),0,1); $('speedArc').style.strokeDasharray=`${spNorm*100} 100`; $('speedNeedleGroup').style.transform=`rotate(${-118+spNorm*236}deg)`; setText('speed', String(Math.round(sp)).padStart(3,'0')); setText('unit', unit==='mph'?'MPH':'KM/H'); setText('odo', `${odoValue().toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`);
  setText('mode', modeLabel()); setText('selector', state.automaticSelector || (state.launchControl?'LAUNCH':state.transmissionMode===1?'AUTO':'SPORT')); setText('gear', gearLabel());
  const rpmNorm=state.electric?clamp(state.normalizedRPM,0,1.15):clamp((state.physicalRPM||0)/(state.redlineRPM||1),0,1.15),active=Math.round(clamp(rpmNorm,0,1)*24); document.querySelectorAll('#rpmLadder i').forEach((s,i)=>{s.className=''; if(i<active) s.classList.add('on'); if(i>=17) s.classList.add('warn'); if(i>=21) s.classList.add('red');}); setText('rpmLabel', state.electric?'POWER BAR':'DIGITAL RPM'); setText('rpmValue', state.electric?Math.round(clamp(state.normalizedRPM,0,1)*100)+'%':Math.round(state.physicalRPM||0).toLocaleString()); setText('redline', state.electric?'100%':Math.round(state.redlineRPM||0).toLocaleString()); setText('vehicle', vehicleLabel());
  const boost=Number(state.boost||0); setText('boost', boost.toFixed(1)); setWidth('boostBar', clamp((boost+1)/4*100,0,100)); $('boostBar').style.background='linear-gradient(90deg,#5fd2ff,var(--cyan))'; setText('fuel', toPct(state.fuel)); setWidth('fuelBar',toPct(state.fuel)); $('fuelBar').style.background='linear-gradient(90deg,#5fd2ff,var(--cyan))'; const temp=Math.round(state.oilTemperature||0); setText('oilTemp', temp); setWidth('oilTempBar', clamp(temp/150*100,0,100)); $('oilTempBar').style.background=temp>125?'linear-gradient(90deg,#ff8a64,var(--red))':temp>110?'linear-gradient(90deg,#ffd57a,var(--amber))':'linear-gradient(90deg,#5fd2ff,var(--cyan))'; const clutch=toPct(state.clutchHeat); setText('clutch', clutch); setWidth('clutchBar', clutch); $('clutchBar').style.background=clutch>75?'linear-gradient(90deg,#ff8a64,var(--red))':clutch>50?'linear-gradient(90deg,#ffd57a,var(--amber))':'linear-gradient(90deg,#7ef89c,var(--green))'; setText('engineHealth',toPct(state.engineHealth)); setText('gearboxHealth',toPct(state.gearboxHealth));
  const thr=toPct(state.throttle), brk=toPct(state.brake); setText('thrPct',thr+'%'); setWidth('thrBar',thr); $('thrBar').style.background='linear-gradient(90deg,#5fd2ff,var(--cyan))'; setText('brkPct',brk+'%'); setWidth('brkBar',brk); $('brkBar').style.background='linear-gradient(90deg,#ff8a64,var(--red))';
  lamp('lABS',state.absEnabled,state.absActive); lamp('lTCS',state.tcsEnabled,state.tcsActive); lamp('lESC',state.escEnabled,state.escActive); lamp('lPB',true,state.parkingBrake); lamp('lLC',state.launchEnabled,state.launchControl); lamp('lBurn',true,state.burnout); lamp('lRoll',true,state.rollWarning);
  const ov=$('overlay'),txt=$('overlayText'); ov.classList.toggle('on',!state.engineOn||state.engineStarting); txt.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF'; txt.classList.toggle('starting',state.engineStarting);
}
initDemo();
})();
</script></body></html>
