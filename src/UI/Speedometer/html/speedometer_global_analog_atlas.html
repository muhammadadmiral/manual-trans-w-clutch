<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT HUD — Global Analog Atlas</title><style>
:root{--scale:1;--fg:#eef8ff;--muted:#7d8f9a;--cyan:#50edff;--amber:#ffbe55;--red:#ff5a67;--green:#82f09f;--blue:#8fc8ff}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--fg)} body{display:grid;place-items:end center;padding-bottom:18px}
#hud{position:relative;width:1080px;height:320px;transform:scale(var(--scale));transform-origin:bottom center;transition:.18s;filter:drop-shadow(0 12px 30px rgba(0,0,0,.4))} #hud.hidden{opacity:0;transform:translateY(16px) scale(.96)}
.panel{position:absolute;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(12,18,23,.72),rgba(7,10,14,.56));backdrop-filter:blur(11px);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.dial{position:absolute;top:16px;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(24,36,42,.85) 0 49%, rgba(8,13,16,.92) 50% 63%, rgba(255,255,255,.05) 64%, rgba(8,13,16,.9) 65% 70%, transparent 71%)} .dial.left{left:0}.dial.right{right:0}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.centerDot{fill:#f4fbff;stroke:#122129;stroke-width:5}.tickMaj{stroke:#d8e6eb;stroke-width:2.2;stroke-linecap:round}.tickMin{stroke:#5f6c73;stroke-width:1;stroke-linecap:round}.tickRed{stroke:var(--red)} .numLabel{fill:#dce8ec;font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:middle} .smallLabel{fill:var(--muted);font-size:10px;font-weight:800;letter-spacing:2px;text-anchor:middle}
.needle{stroke:var(--cyan);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(80,237,255,.5))}.needle.spd{stroke:#f2f7fa;filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
.dialText{position:absolute;left:0;right:0;text-align:center}.dialText .value{font:900 34px/.95 "Arial Narrow",Inter,sans-serif}.dialText .unit{font-size:11px;color:var(--muted);letter-spacing:3px;font-weight:800}.dial.left .dialText{top:188px}.dial.right .dialText{top:188px}
.mid{position:absolute;left:318px;right:318px;top:20px;height:250px;padding:14px 16px}.brand{font-size:10px;letter-spacing:5px;color:#95a9b4;font-weight:900;text-align:center}.brand b{color:var(--cyan)}
.toprow{margin-top:10px;display:flex;justify-content:space-between;align-items:flex-start}.mode{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:800}.selector{margin-top:8px;font-size:10px;letter-spacing:2px;color:var(--amber);font-weight:800}.gear{font:900 80px/.82 "Arial Narrow",Inter,sans-serif}
.strip{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{padding:12px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)} .tile .k{font-size:9px;letter-spacing:1.8px;color:var(--muted);font-weight:800}.tile .v{margin-top:6px;font:800 22px/1 "Roboto Mono",Consolas,monospace}.bar{height:6px;background:rgba(255,255,255,.07);border-radius:8px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:inherit}
.inputs{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.in{padding:11px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)} .in .h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.tr{height:7px;background:rgba(255,255,255,.07);border-radius:8px;margin-top:8px;overflow:hidden}.tr i{display:block;height:100%;width:0;border-radius:inherit}
.lamps{position:absolute;left:318px;right:318px;bottom:14px;display:flex;justify-content:center;gap:8px}.lamp{min-width:58px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(8,13,16,.5);font-size:10px;letter-spacing:1px;color:#5f717a;font-weight:900;text-align:center;backdrop-filter:blur(8px)} .lamp.enabled{color:#91a4ad}.lamp.active{color:#041015;background:rgba(80,237,255,.95);border-color:transparent;box-shadow:0 0 14px rgba(80,237,255,.32)} .lamp.warn.active{background:rgba(255,190,85,.95)} .lamp.danger.active{background:rgba(255,90,103,.95);color:#fff}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border-radius:34px;opacity:0;pointer-events:none}.overlay.on{opacity:1}.overlay b{font-size:16px;letter-spacing:5px}.overlay b.starting{color:var(--amber);animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.35}}
.demo-panel{position:fixed;top:10px;right:10px;width:275px;max-height:calc(100vh - 20px);overflow:auto;padding:10px;border-radius:12px;background:rgba(5,8,10,.94);color:#d7e7ee;border:1px solid #2a4048;font:11px Consolas,monospace;z-index:10}.demo-panel h4{margin:8px 0 4px;color:var(--cyan);font-size:11px}.demo-panel label{display:grid;grid-template-columns:86px 1fr 42px;gap:6px;align-items:center;margin:4px 0}.demo-panel button{margin:2px;border:1px solid #34505b;background:#0d161b;color:#99b8c4;border-radius:6px;padding:4px 6px;font:10px Consolas;cursor:pointer}.demo-panel button.on{background:var(--cyan);color:#051015;border-color:transparent} body.game .demo-panel{display:none}
@media (max-width:1120px){:root{--scale:.82}} @media (max-width:900px){:root{--scale:.66}}
</style></head><body>
<div id="hud">
 <div class="dial left"><svg id="rpmSvg" viewBox="0 0 290 290"></svg><div class="dialText"><div class="value" id="rpmValue">4,620</div><div class="unit" id="rpmUnit">RPM</div></div></div>
 <div class="panel mid"><div class="brand">ATLAS <b>ANALOG</b></div><div class="toprow"><div><div class="mode" id="mode">MANUAL</div><div class="selector" id="selector">SPORT</div></div><div class="gear" id="gear">4</div></div>
 <div class="strip"><div class="tile"><div class="k">BOOST</div><div class="v"><span id="boost">0.5</span></div><div class="bar"><i id="boostBar"></i></div></div><div class="tile"><div class="k">FUEL</div><div class="v"><span id="fuel">64</span>%</div><div class="bar"><i id="fuelBar"></i></div></div><div class="tile"><div class="k">OIL TEMP</div><div class="v"><span id="oilTemp">94</span>°</div><div class="bar"><i id="oilTempBar"></i></div></div><div class="tile"><div class="k">CLUTCH</div><div class="v"><span id="clutch">28</span>%</div><div class="bar"><i id="clutchBar"></i></div></div></div>
 <div class="strip"><div class="tile"><div class="k">ENGINE</div><div class="v"><span id="engineHealth">92</span>%</div></div><div class="tile"><div class="k">GEARBOX</div><div class="v"><span id="gearboxHealth">87</span>%</div></div><div class="tile"><div class="k">ODO</div><div class="v" id="odo">31,842.6 km</div></div><div class="tile"><div class="k">VEHICLE</div><div class="v" id="vehicle">CAR</div></div></div>
 <div class="inputs"><div class="in"><div class="h"><span>THROTTLE</span><b id="thrPct">48%</b></div><div class="tr"><i id="thrBar"></i></div></div><div class="in"><div class="h"><span>BRAKE</span><b id="brkPct">6%</b></div><div class="tr"><i id="brkBar"></i></div></div></div>
 </div>
 <div class="dial right"><svg id="speedSvg" viewBox="0 0 290 290"></svg><div class="dialText"><div class="value" id="speed">126</div><div class="unit" id="unit">KM/H</div></div></div>
 <div class="lamps"><div class="lamp" id="lABS">ABS</div><div class="lamp" id="lTCS">TCS</div><div class="lamp" id="lESC">ESC</div><div class="lamp warn" id="lPB">PARK</div><div class="lamp" id="lLC">LC</div><div class="lamp danger" id="lBurn">BURN</div><div class="lamp danger" id="lRoll">ROLL</div></div>
 <div class="overlay" id="overlay"><b id="overlayText">ENGINE OFF</b></div>
</div>
<div class="demo-panel"><h4>DEMO</h4>
<label>Speed <input data-key="speedKmH" type="range" min="0" max="420" value="126"><output>126</output></label>
<label>RPM <input data-key="physicalRPM" type="range" min="0" max="18000" value="4620"><output>4620</output></label>
<label>Norm RPM <input data-key="normalizedRPM" type="range" min="0" max="1.2" step="0.01" value="0.56"><output>0.56</output></label>
<label>Gear <input data-key="gear" type="range" min="-1" max="12" value="4"><output>4</output></label>
<label>Fuel <input data-key="fuel" type="range" min="0" max="100" value="64"><output>64</output></label>
<label>Oil Temp <input data-key="oilTemperature" type="range" min="0" max="160" value="94"><output>94</output></label>
<label>Oil Life <input data-key="oilLife" type="range" min="0" max="100" value="81"><output>81</output></label>
<label>Clutch <input data-key="clutchHeat" type="range" min="0" max="100" value="28"><output>28</output></label>
<label>Boost <input data-key="boost" type="range" min="-1" max="3" step="0.1" value="0.5"><output>0.5</output></label>
<label>Throttle <input data-key="throttle" type="range" min="0" max="1" step="0.01" value="0.48"><output>0.48</output></label>
<label>Brake <input data-key="brake" type="range" min="0" max="1" step="0.01" value="0.06"><output>0.06</output></label>
<label>Eng Health <input data-key="engineHealth" type="range" min="0" max="100" value="92"><output>92</output></label>
<label>GB Health <input data-key="gearboxHealth" type="range" min="0" max="100" value="87"><output>87</output></label>
<h4>TOGGLES</h4><div id="demoButtons"></div>
<h4>PRESET</h4><button data-preset="city">CITY</button><button data-preset="sport">SPORT</button><button data-preset="truck">TRUCK</button><button data-preset="moto">MOTO</button><button data-preset="ev">EV</button><button id="unitBtn">KM/H ↔ MPH</button></div><script>(()=>{'use strict';
const K=.621371,$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,Number(v)||0)),toPct=v=>Math.round(v<=1?clamp(v)*100:clamp(v,0,100));
const state={speedKmH:126,normalizedRPM:.56,physicalRPM:4620,redlineRPM:7600,fuel:64,oilTemperature:94,oilLife:81,engineHealth:92,gearboxHealth:87,clutchHeat:28,boost:.5,odometerKm:31842.6,throttle:.48,brake:.06,maximumSpeedKmH:320,gear:4,maxGear:7,transmissionMode:0,automaticSelector:null,motorcycle:false,electric:false,engineOn:true,engineStarting:false,parkingBrake:false,tcsEnabled:true,tcsActive:false,absEnabled:true,absActive:false,escEnabled:true,escActive:false,launchEnabled:true,rollWarning:false,launchControl:false,burnout:false,vehicleClass:1,modelHash:0x1A2B3C4D};
let unit='kmh';
function gearLabel(){if(state.transmissionMode===1&&state.automaticSelector)return String(state.automaticSelector);return state.gear<0?'R':state.gear===0?'N':String(state.gear)}
function speedValue(){return state.speedKmH*(unit==='mph'?K:1)}
function odoValue(){return state.odometerKm*(unit==='mph'?K:1)}
function modeLabel(){return ['MANUAL','AUTO','SEQUENTIAL'][state.transmissionMode]||`MODE ${state.transmissionMode}`}
function vehicleLabel(){if(state.electric) return state.motorcycle?'E-MOTO':'EV'; return state.motorcycle?'MOTO':'CAR';}
function lamp(id,en,on){const e=$(id); if(!e) return; e.classList.toggle('enabled',!!en); e.classList.toggle('active',!!on)}
function setText(id,val){const e=$(id); if(e) e.textContent=val}
function setWidth(id,p){const e=$(id); if(e) e.style.width=clamp(p,0,100)+'%'}
function setHeight(id,p){const e=$(id); if(e) e.style.height=clamp(p,0,100)+'%'}
function setRotate(id,deg){const e=$(id); if(e) e.style.transform=`rotate(${deg}deg)`}
const Dash={update(p={}){Object.assign(state,p);render()},setVehicle(p={}){Object.assign(state,p);render()},setUnit(u){unit=String(u).toLowerCase()==='mph'?'mph':'kmh';render()},setVisible(v){$('hud').classList.toggle('hidden',!v)},getState(){return {...state,unit}}};
window.Dash=Dash;
window.addEventListener('message',e=>{const m=e.data||{}; if(m.type==='updateHud') Dash.update(m.data||{}); else if(m.type==='setVehicle') Dash.setVehicle(m.data||{}); else if(m.type==='setUnit') Dash.setUnit(m.data?.unit); else if(m.type==='setVisible') Dash.setVisible(m.visible ?? m.data?.visible);});
function initDemo(){document.querySelectorAll('[data-key]').forEach(i=>{const out=i.nextElementSibling; if(out&&out.tagName==='OUTPUT') out.value=i.value; i.addEventListener('input',()=>{state[i.dataset.key]=Number(i.value); if(out&&out.tagName==='OUTPUT') out.value=i.value; render();});}); const box=$('demoButtons'); if(box){const toggles=['engineOn','engineStarting','parkingBrake','tcsEnabled','tcsActive','absEnabled','absActive','escEnabled','escActive','launchEnabled','launchControl','rollWarning','burnout','motorcycle','electric']; toggles.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.classList.toggle('on',!!state[k]); b.onclick=()=>{state[k]=!state[k]; b.classList.toggle('on',!!state[k]); render();}; box.appendChild(b);});}
 const presets={city:{maximumSpeedKmH:180,redlineRPM:6500,maxGear:5,electric:false,motorcycle:false},sport:{maximumSpeedKmH:340,redlineRPM:8500,maxGear:7,electric:false,motorcycle:false},truck:{maximumSpeedKmH:150,redlineRPM:4200,maxGear:12,electric:false,motorcycle:false},moto:{maximumSpeedKmH:299,redlineRPM:14500,maxGear:6,electric:false,motorcycle:true},ev:{maximumSpeedKmH:250,redlineRPM:18000,maxGear:1,electric:true,motorcycle:false}};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>Dash.setVehicle(presets[b.dataset.preset]||{})); const ub=$('unitBtn'); if(ub) ub.onclick=()=>Dash.setUnit(unit==='kmh'?'mph':'kmh'); if(new URLSearchParams(location.search).has('game')) document.body.classList.add('game'); render();}

const NS='http://www.w3.org/2000/svg';
function pol(cx,cy,r,a){const rad=(a-90)*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}}
function buildDial(svgId, maxVal, labelFn, redFrom){const svg=$(svgId); svg.innerHTML=''; const cx=145,cy=145,start=-130,end=130; for(let v=0; v<=maxVal+1e-6; v+=maxVal/8){const a=start+(v/maxVal)*(end-start); let p1=pol(cx,cy,100,a), p2=pol(cx,cy,122,a), pl=pol(cx,cy,84,a); const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',p1.x);ln.setAttribute('y1',p1.y);ln.setAttribute('x2',p2.x);ln.setAttribute('y2',p2.y); ln.setAttribute('class', (redFrom!=null&&v>=redFrom)?'tickMaj tickRed':'tickMaj'); svg.appendChild(ln); const t=document.createElementNS(NS,'text'); t.setAttribute('x',pl.x);t.setAttribute('y',pl.y+4);t.setAttribute('class','numLabel'); t.textContent=labelFn(v); svg.appendChild(t); if(v<maxVal){for(let i=1;i<5;i++){const mv=v+maxVal/8*i/5, ma=start+(mv/maxVal)*(end-start); p1=pol(cx,cy,108,ma); p2=pol(cx,cy,122,ma); const m=document.createElementNS(NS,'line'); m.setAttribute('x1',p1.x);m.setAttribute('y1',p1.y);m.setAttribute('x2',p2.x);m.setAttribute('y2',p2.y); m.setAttribute('class',(redFrom!=null&&mv>=redFrom)?'tickMin tickRed':'tickMin'); svg.appendChild(m);}}}
 const lab=document.createElementNS(NS,'text'); lab.setAttribute('x',145); lab.setAttribute('y',168); lab.setAttribute('class','smallLabel'); lab.textContent=svgId==='rpmSvg'?'RPM SCALE':'SPEED SCALE'; svg.appendChild(lab); const nd=document.createElementNS(NS,'line'); nd.setAttribute('id',svgId+'Needle'); nd.setAttribute('x1',145); nd.setAttribute('y1',145); nd.setAttribute('x2',145); nd.setAttribute('y2',42); nd.setAttribute('class',svgId==='rpmSvg'?'needle':'needle spd'); svg.appendChild(nd); const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',145); c.setAttribute('cy',145); c.setAttribute('r',10); c.setAttribute('class','centerDot'); svg.appendChild(c); }
function updateNeedle(svgId,val,maxVal){const deg=-130 + clamp(val/maxVal,0,1.15)*260; setRotate(svgId+'Needle',deg)}
function render(){ const rpmMax=state.electric?100:Math.max(1000,Math.ceil((state.redlineRPM||7000)/1000)*1000); const speedMax=Math.max(60, state.maximumSpeedKmH*(unit==='mph'?K:1)); buildDial('rpmSvg', state.electric?100:rpmMax, v=>state.electric?Math.round(v):Math.round(v/1000), state.electric?null:state.redlineRPM); buildDial('speedSvg', speedMax, v=>Math.round(v), null); const rpmDisplay=state.electric?Math.round(clamp(state.normalizedRPM,0,1)*100):Math.round(state.physicalRPM||0); setText('rpmValue', rpmDisplay.toLocaleString()); setText('rpmUnit', state.electric?'POWER %':'RPM'); updateNeedle('rpmSvg', state.electric?rpmDisplay:state.physicalRPM||0, state.electric?100:rpmMax); const sp=speedValue(); setText('speed', String(Math.round(sp)).padStart(3,'0')); setText('unit', unit==='mph'?'MPH':'KM/H'); updateNeedle('speedSvg', sp, speedMax);
 setText('mode', modeLabel()); setText('selector', state.automaticSelector || (state.launchControl?'LAUNCH':state.transmissionMode===1?'AUTO':'SPORT')); setText('gear', gearLabel()); setText('boost', Number(state.boost||0).toFixed(1)); setWidth('boostBar', clamp((Number(state.boost||0)+1)/4*100,0,100)); $('boostBar').style.background='linear-gradient(90deg,#5ecfff,var(--cyan))'; setText('fuel',toPct(state.fuel)); setWidth('fuelBar',toPct(state.fuel)); $('fuelBar').style.background='linear-gradient(90deg,#5ecfff,var(--cyan))'; const temp=Math.round(state.oilTemperature||0); setText('oilTemp',temp); setWidth('oilTempBar', clamp(temp/150*100,0,100)); $('oilTempBar').style.background=temp>125?'linear-gradient(90deg,#ff8d70,var(--red))':temp>110?'linear-gradient(90deg,#ffd581,var(--amber))':'linear-gradient(90deg,#5ecfff,var(--cyan))'; const clutch=toPct(state.clutchHeat); setText('clutch',clutch); setWidth('clutchBar',clutch); $('clutchBar').style.background=clutch>75?'linear-gradient(90deg,#ff8d70,var(--red))':clutch>50?'linear-gradient(90deg,#ffd581,var(--amber))':'linear-gradient(90deg,#79ef9c,var(--green))'; setText('engineHealth',toPct(state.engineHealth)); setText('gearboxHealth',toPct(state.gearboxHealth)); setText('odo', `${odoValue().toLocaleString(undefined,{maximumFractionDigits:1})} ${unit==='mph'?'mi':'km'}`); setText('vehicle',vehicleLabel()); const thr=toPct(state.throttle), brk=toPct(state.brake); setText('thrPct',thr+'%'); setWidth('thrBar',thr); $('thrBar').style.background='linear-gradient(90deg,#5ecfff,var(--cyan))'; setText('brkPct',brk+'%'); setWidth('brkBar',brk); $('brkBar').style.background='linear-gradient(90deg,#ff8d70,var(--red))';
 lamp('lABS',state.absEnabled,state.absActive); lamp('lTCS',state.tcsEnabled,state.tcsActive); lamp('lESC',state.escEnabled,state.escActive); lamp('lPB',true,state.parkingBrake); lamp('lLC',state.launchEnabled,state.launchControl); lamp('lBurn',true,state.burnout); lamp('lRoll',true,state.rollWarning); const ov=$('overlay'), txt=$('overlayText'); ov.classList.toggle('on', !state.engineOn || state.engineStarting); txt.textContent=state.engineStarting?'ENGINE STARTING':'ENGINE OFF'; txt.classList.toggle('starting',state.engineStarting);} initDemo();
})();</script></body></html>
